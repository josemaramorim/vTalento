<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Isolada de Usuários - V-Talentos SaaS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Estilos e Layout */
        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .selector-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: var(--radius-md);
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }
        .selector-box select {
            min-width: 250px;
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            cursor: pointer;
        }
        .selector-box select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        /* Tabela migrada para PremiumGrid no style.css global */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-admin { background: rgba(212, 175, 55, 0.1); color: var(--accent-primary); border: 1px solid rgba(212, 175, 55, 0.2); }
        .badge-corretor { background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.2); }

        /* Modal Overlay Premium */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: var(--radius-md);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .modal-close-btn:hover {
            color: var(--error);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.9rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        /* Paginação migrada para PremiumGrid no style.css global */
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">V-<span>TALENTOS</span></div>
            <nav id="navLinks">
                <!-- Injetado dinamicamente -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <div class="page-header-actions animate-fade">
                <h1 style="font-size: 1.6rem; font-weight: 600;">👥 Gestão Lógica Isolada de Usuários</h1>
                <button class="btn btn-primary" id="btnNovoUsuario" onclick="openNewUsuarioModal()" style="font-weight: 600;">➕ ADICIONAR NOVO USUÁRIO</button>
            </div>

            <div class="selector-box animate-fade" style="animation-delay: 0.05s;">
                <label for="tenantSelect" style="font-weight: 600; font-size: 0.95rem;">Empresa Alvo (Isolamento):</label>
                <select id="tenantSelect" onchange="handleTenantChange()">
                    <option value="">Selecione uma empresa...</option>
                </select>
            </div>

            <section class="glass animate-fade" style="padding: 25px; margin-top: 20px; margin-bottom: 25px; animation-delay: 0.1s;">
                <div id="gridUsuarios"></div>
            </section>
        </main>
    </div>

    <!-- MODAL: NOVO USUÁRIO -->
    <div class="modal-overlay" id="newUsuarioModal">
        <div class="modal-card glass">
            <div class="modal-header">
                <h2 id="newModalTitle" style="font-size: 1.2rem; font-weight: 600;">👥 Adicionar Usuário no Tenant</h2>
                <button class="modal-close-btn" onclick="closeModal('newUsuarioModal')">✕</button>
            </div>
            <form id="newUsuarioForm">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="color: var(--accent-primary); font-weight: 700; letter-spacing: 0.5px;">Empresa de Destino (Tenant)</label>
                    <input type="text" id="newTenantDisplay" class="form-control" disabled style="background: rgba(255,255,255,0.05); cursor: not-allowed; font-weight: 600; color: var(--accent-primary); border-color: rgba(212,175,55,0.25);">
                </div>
                <div class="form-group">
                    <label for="newNome">Nome Completo</label>
                    <input type="text" id="newNome" class="form-control" required placeholder="Ex: João da Silva">
                </div>
                <div class="form-group">
                    <label for="newEmail">E-mail de Acesso</label>
                    <input type="email" id="newEmail" class="form-control" required placeholder="Ex: joao@empresa.com">
                </div>
                <div class="form-group">
                    <label for="newSenha">Senha Provisória</label>
                    <input type="password" id="newSenha" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="newCpf">CPF (Opcional)</label>
                    <input type="text" id="newCpf" class="form-control" placeholder="Apenas números">
                </div>
                <div class="form-group">
                    <label for="newIdentificadorExtra">Identificador Extra (Opcional)</label>
                    <input type="text" id="newIdentificadorExtra" class="form-control" placeholder="Ex: CRECI, CRM, Matrícula">
                </div>
                <div class="form-group">
                    <label for="newPerfil">Perfil de Acesso</label>
                    <select id="newPerfil" class="form-control">
                        <option value="CORRETOR" selected>CORRETOR (Colaborador)</option>
                        <option value="ADMIN_EMPRESA">ADMIN_EMPRESA (Administrador da Empresa)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600; margin-top: 15px;">SALVAR USUÁRIO</button>
            </form>
        </div>
    </div>

    <!-- MODAL: EDITAR USUÁRIO -->
    <div class="modal-overlay" id="editUsuarioModal">
        <div class="modal-card glass">
            <div class="modal-header">
                <h2 id="editModalTitle" style="font-size: 1.2rem; font-weight: 600;">✏️ Editar Dados do Usuário</h2>
                <button class="modal-close-btn" onclick="closeModal('editUsuarioModal')">✕</button>
            </div>
            <form id="editUsuarioForm">
                <input type="hidden" id="editId">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="color: var(--accent-primary); font-weight: 700; letter-spacing: 0.5px;">Empresa de Destino (Tenant)</label>
                    <input type="text" id="editTenantDisplay" class="form-control" disabled style="background: rgba(255,255,255,0.05); cursor: not-allowed; font-weight: 600; color: var(--accent-primary); border-color: rgba(212,175,55,0.25);">
                </div>
                <div class="form-group">
                    <label for="editNome">Nome Completo</label>
                    <input type="text" id="editNome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="editEmail">E-mail</label>
                    <input type="email" id="editEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="editCpf">CPF (Opcional)</label>
                    <input type="text" id="editCpf" class="form-control">
                </div>
                <div class="form-group">
                    <label for="editIdentificadorExtra">Identificador Extra (Opcional)</label>
                    <input type="text" id="editIdentificadorExtra" class="form-control" placeholder="Ex: CRECI, CRM, Matrícula">
                </div>
                <div class="form-group">
                    <label for="editPerfil">Perfil de Acesso</label>
                    <select id="editPerfil" class="form-control">
                        <option value="CORRETOR">CORRETOR</option>
                        <option value="ADMIN_EMPRESA">ADMIN_EMPRESA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editAtivo">Status da Conta</label>
                    <select id="editAtivo" class="form-control">
                        <option value="true">ATIVO</option>
                        <option value="false">INATIVO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editSenha">Alterar Senha (Opcional)</label>
                    <input type="password" id="editSenha" class="form-control" placeholder="Deixe vazio para manter a atual">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600; margin-top: 15px;">SALVAR ALTERAÇÕES</button>
            </form>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/premium-grid.js"></script>
    <script>
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userStr);
        if (user.perfil !== 'SUPER_ADMIN') {
            window.location.href = 'dashboard.html';
        }

        // Renderiza o cabeçalho dinâmico do Super-Admin
        renderHeader('Usuários SaaS', 'Gestão e controle completo de corretores e administradores isolados por empresa');

        // Renderiza Sidebar
        const nav = document.getElementById('navLinks');
        nav.innerHTML = `
            <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px;">SAAS PLATAFORMA</p>
            <a href="super-dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">📊 Plataforma Dashboard</a>
            <a href="super-empresas.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">🏢 Inquilinos (Empresas)</a>
            <a href="super-usuarios.html" class="active" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">👥 Usuários Isolados</a>
            <a href="super-faturamento.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">💰 Faturamento SaaS</a>
            <a href="super-provedores.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">💳 Provedores de Pgto.</a>
            <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-top: 20px; margin-bottom: 10px;">PERFIL</p>
            <a href="meu-perfil.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👤 Meus Dados</a>
        `;

        let currentPage = 1;
        const limitPerPage = 10;
        let selectedTenantId = '';
        let searchTimeout = null;

        // Formatação Helpers
        function formatReal(val) {
            return parseFloat(val || 0).toFixed(2) + ' T$';
        }

        // Carregar Dropdown de Empresas
        async function loadTenants() {
            try {
                const res = await fetch('http://localhost:3001/api/super/empresas?limit=100', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    const select = document.getElementById('tenantSelect');
                    select.innerHTML = '<option value="">Selecione uma empresa...</option>';
                    data.data.forEach(emp => {
                        const opt = document.createElement('option');
                        opt.value = emp.id;
                        opt.innerText = `${emp.nome} (/${emp.slug})`;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                showToast('Erro ao carregar lista de inquilinos.', 'error');
            }
        }

        let globalGrid = null;

        // Eventos do Dropdown
        function handleTenantChange() {
            const select = document.getElementById('tenantSelect');
            selectedTenantId = select.value;
            
            if (globalGrid) {
                globalGrid.state.page = 1;
                globalGrid.refresh();
            }
        }

        async function setupGrid() {
            globalGrid = new PremiumGrid({
                containerId: 'gridUsuarios',
                title: 'Usuários Cadastrados na Plataforma',
                totalCountId: 'superUsuariosTotalCount',
                columns: [
                    { key: 'nome', label: 'Nome Completo', bold: true, sortable: true },
                    { key: 'email', label: 'E-mail de Acesso', sortable: true },
                    { key: 'cpf', label: 'CPF', sortable: true },
                    { key: 'identificador_extra', label: 'ID Extra', sortable: true },
                    { key: 'perfil', label: 'Perfil / Permissão', align: 'center', sortable: true },
                    { key: 'saldos', label: 'Saldos (Disponível / A Receber)', align: 'left', sortable: true },
                    { key: 'status', label: 'Status', align: 'center', sortable: true },
                    { key: 'acoes', label: 'Ações', align: 'right' }
                ],
                filters: [
                    { id: 'busca', label: 'Pesquisar', type: 'text', placeholder: 'Buscar por Nome, E-mail ou CPF...' },
                    { id: 'perfil', label: 'Perfil', type: 'select', options: [
                        { value: 'CORRETOR', label: 'Corretor' },
                        { value: 'ADMIN_EMPRESA', label: 'Admin da Empresa' }
                    ]},
                    { id: 'ativo', label: 'Status', type: 'select', options: [
                        { value: 'true', label: 'Ativo' },
                        { value: 'false', label: 'Inativo' }
                    ]}
                ],
                pagination: { enabled: true, defaultPageSize: 10, pageSizeOptions: [10, 50, 100] },
                cellRenderer: (row, col) => {
                    if (col.key === 'nome') return `<strong>${row.nome}</strong>`;
                    if (col.key === 'perfil') {
                        const badgeClass = row.perfil === 'ADMIN_EMPRESA' ? 'badge-admin' : 'badge-corretor';
                        const roleLabel = row.perfil === 'ADMIN_EMPRESA' ? 'Admin' : 'Corretor';
                        return `<span class="badge ${badgeClass}">${roleLabel}</span>`;
                    }
                    if (col.key === 'cpf') return row.cpf || 'Não informado';
                    if (col.key === 'identificador_extra') return row.identificador_extra || 'Não informado';
                    if (col.key === 'saldos') return `<strong>${formatReal(row.saldo_disponivel)}</strong> / <span style="color:var(--text-secondary); font-size:0.8rem;">${formatReal(row.saldo_a_receber)}</span>`;
                    if (col.key === 'status') {
                        const isAtivo = row.ativo === true || row.ativo === 1 || String(row.ativo) === 'true' || String(row.ativo) === '1';
                        const bg = isAtivo ? 'rgba(46,213,115,0.12)' : 'rgba(252,129,74,0.12)';
                        const color = isAtivo ? 'var(--success)' : 'var(--error)';
                        const label = isAtivo ? 'Ativo' : 'Inativo';
                        return `<span class="badge" style="background: ${bg}; color: ${color}; border: 1px solid rgba(255,255,255,0.05); font-weight:600;">${label}</span>`;
                    }
                    if (col.key === 'acoes') {
                        return `
                            <button type="button" class="btn btn-primary" onclick="openEditUsuarioModal('${row.id}')" style="padding: 6px 12px; font-size: 0.75rem; font-weight:600; border-radius:4px; margin-right:5px; box-shadow:none;">✏️ EDITAR</button>
                            <button type="button" class="btn" onclick="deletarUsuario('${row.id}')" style="padding: 6px 12px; font-size: 0.75rem; font-weight:600; background:rgba(255,0,0,0.1); color:var(--error); border-radius:4px;">❌ EXCLUIR</button>
                        `;
                    }
                    return row[col.key];
                },
                fetchFn: async (params) => {
                    if (!selectedTenantId) {
                        return { rows: [], total: 0 };
                    }
                    
                    let url = `http://localhost:3001/api/super/empresas/${selectedTenantId}/usuarios?page=${params.page}&limit=${params.limit}&_t=${Date.now()}`;
                    if (params.filters && params.filters.busca) url += `&busca=${encodeURIComponent(params.filters.busca)}`;
                    if (params.filters && params.filters.perfil) url += `&perfil=${encodeURIComponent(params.filters.perfil)}`;
                    if (params.filters && params.filters.ativo) url += `&ativo=${encodeURIComponent(params.filters.ativo)}`;
                    if (params.sortBy) url += `&sort_by=${encodeURIComponent(params.sortBy)}&sort_dir=${encodeURIComponent(params.sortDir)}`;

                    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await res.json();
                    if (!data.success) throw new Error(data.error);

                    currentPage = params.page; // Sincroniza a página atual
                    return { rows: data.data, total: data.meta.total };
                }
            });
            await globalGrid.init();
        }

        function fetchUsuarios(page) {
            if (globalGrid) {
                if (page !== undefined) {
                    globalGrid.state.page = page;
                }
                globalGrid.refresh();
            }
        }

        // Modal Controle
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // NOVO USUÁRIO
        function openNewUsuarioModal() {
            if (!selectedTenantId) {
                showToast('Selecione uma empresa (inquilino) no seletor acima antes de adicionar um usuário.', 'error');
                return;
            }

            document.getElementById('newUsuarioForm').reset();
            
            // Busca o nome da empresa selecionada no combo box principal
            const select = document.getElementById('tenantSelect');
            const tenantName = select.options[select.selectedIndex].text;
            
            document.getElementById('newModalTitle').innerText = '👥 Adicionar Usuário';
            document.getElementById('newTenantDisplay').value = tenantName;
            
            openModal('newUsuarioModal');
        }
        document.getElementById('newUsuarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                nome: document.getElementById('newNome').value,
                email: document.getElementById('newEmail').value,
                senha: document.getElementById('newSenha').value,
                cpf: document.getElementById('newCpf').value,
                identificador_extra: document.getElementById('newIdentificadorExtra').value,
                perfil: document.getElementById('newPerfil').value
            };

            try {
                const res = await fetch(`http://localhost:3001/api/super/empresas/${selectedTenantId}/usuarios`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Usuário cadastrado com sucesso!', 'success');
                    closeModal('newUsuarioModal');
                    fetchUsuarios(1); // Sempre volta para página 1 ao criar novo usuário
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // EDITAR USUÁRIO
        function openEditUsuarioModal(id) {
            const row = globalGrid.state.data.find(r => r.id === id);
            if (!row) return;

            document.getElementById('editId').value = row.id;
            document.getElementById('editNome').value = row.nome;
            document.getElementById('editEmail').value = row.email;
            document.getElementById('editCpf').value = row.cpf || '';
            document.getElementById('editIdentificadorExtra').value = row.identificador_extra || '';
            document.getElementById('editPerfil').value = row.perfil;
            const isAtivo = row.ativo === true || row.ativo === 1 || String(row.ativo) === 'true' || String(row.ativo) === '1';
            document.getElementById('editAtivo').value = String(isAtivo);
            document.getElementById('editSenha').value = '';
            
            // Busca o nome da empresa selecionada no combo box principal
            const select = document.getElementById('tenantSelect');
            const tenantName = select.options[select.selectedIndex].text;
            
            document.getElementById('editModalTitle').innerText = '✏️ Editar Dados do Usuário';
            document.getElementById('editTenantDisplay').value = tenantName;
            
            openModal('editUsuarioModal');
        }
        document.getElementById('editUsuarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const payload = {
                nome: document.getElementById('editNome').value,
                email: document.getElementById('editEmail').value,
                cpf: document.getElementById('editCpf').value,
                identificador_extra: document.getElementById('editIdentificadorExtra').value,
                perfil: document.getElementById('editPerfil').value,
                ativo: document.getElementById('editAtivo').value === 'true'
            };
            const senha = document.getElementById('editSenha').value;
            if (senha) payload.senha = senha;

            try {
                const res = await fetch(`http://localhost:3001/api/super/empresas/${selectedTenantId}/usuarios/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Cadastro do usuário atualizado!', 'success');
                    closeModal('editUsuarioModal');
                    fetchUsuarios(currentPage);
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // DELETAR USUÁRIO
        async function deletarUsuario(id) {
            if (!confirm('Deseja realmente excluir permanentemente este usuário da empresa? Esta ação não pode ser desfeita.')) return;

            try {
                const res = await fetch(`http://localhost:3001/api/super/empresas/${selectedTenantId}/usuarios/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Usuário excluído do tenant com sucesso!', 'success');
                    fetchUsuarios(currentPage);
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTenants();
            setupGrid();
        });
    </script>
</body>
</html>
