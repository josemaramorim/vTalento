<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provedores de Pagamento - V-Talentos SaaS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .provider-card {
            padding: 25px;
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .provider-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .provider-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.04) 0%, transparent 70%);
            border-radius: 50%;
        }
        .provider-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .provider-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .provider-card-type {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .provider-card-type.stripe { background: rgba(103, 114, 229, 0.15); color: #6772e5; border: 1px solid rgba(103, 114, 229, 0.3); }
        .provider-card-type.asaas { background: rgba(52, 152, 219, 0.15); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.3); }
        .provider-card-type.generic { background: rgba(212, 175, 55, 0.15); color: var(--accent-primary); border: 1px solid rgba(212, 175, 55, 0.3); }
        
        .provider-card-body {
            flex-grow: 1;
            margin-bottom: 20px;
        }
        .provider-config-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .provider-config-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .provider-config-item code {
            font-family: monospace;
            color: var(--text-primary);
            background: rgba(255,255,255,0.04);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .provider-card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Modal Overlay Premium */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-width: 550px;
            width: 100%;
            padding: 30px;
            border-radius: var(--radius-md);
            overflow-y: auto;
            max-height: 90vh;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        /* Dynamic Param Rows */
        .dynamic-param-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .toggle-switch input { display: none; }
        .switch-slider {
            display: inline-block;
            width: 46px; height: 22px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 11px;
            position: relative;
            transition: background 0.3s ease;
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .switch-slider::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 16px; height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        input:checked + .switch-slider { background: var(--success); }
        input:checked + .switch-slider::before { transform: translateX(24px); }

        .badge-status {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-status.active { background: rgba(46, 204, 113, 0.15); color: var(--success); }
        .badge-status.inactive { background: rgba(231, 76, 60, 0.15); color: var(--error); }
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">V-<span>TALENTOS</span></div>
            <nav id="navLinks">
                <!-- Injetado dinamicamente -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Top Header Action -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;" class="animate-fade">
                <div>
                    <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--text-primary);">💳 Gerenciar Provedores de Pagamento</h2>
                    <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px;">Cadastre e gerencie os meios de quitação integrados à plataforma.</p>
                </div>
                <button class="btn btn-primary" onclick="openProvedorModal()" style="font-weight: 600; font-size: 0.85rem; padding: 10px 20px;">➕ ADICIONAR PROVEDOR</button>
            </div>

            <!-- Grid of Cards -->
            <section class="providers-grid animate-fade" id="providersGridContainer" style="animation-delay: 0.05s;">
                <!-- Injetado dinamicamente -->
                <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px;">Carregando provedores...</div>
            </section>

            <!-- MODAL: DYNAMIC CONFIG PROVEDOR -->
            <div class="modal-overlay" id="provedorModal">
                <div class="modal-card glass">
                    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 20px;">
                        <h2 id="provedorModalTitle" style="font-size: 1.15rem; font-weight: 700;">➕ Cadastrar Novo Provedor</h2>
                        <button class="modal-close-btn" onclick="closeProvedorModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; line-height: 1;">✕</button>
                    </div>
                    <form id="provedorForm">
                        <input type="hidden" id="provedorId">
                        
                        <div class="form-group">
                            <label for="provNome">Nome Amigável do Provedor</label>
                            <input type="text" id="provNome" class="form-control" placeholder="Ex: Stripe Brasil" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="provTipo">Tipo / Chave de Integração</label>
                            <select id="provTipo" class="form-control" onchange="onTipoSelection()" style="cursor:pointer;" required>
                                <option value="STRIPE" selected>Stripe (Cartão de Crédito)</option>
                                <option value="ASAAS">Asaas (Pix/Boleto)</option>
                                <option value="CUSTOM">Outro (Customizado/Genérico)</option>
                            </select>
                        </div>

                        <div class="form-group" id="customTipoGroup" style="display: none;">
                            <label for="provTipoCustom">Digite o Código do Provedor Customizado</label>
                            <input type="text" id="provTipoCustom" class="form-control" placeholder="Ex: MERCADOPAGO, PAYPAL">
                        </div>

                        <!-- Dynamic Key-Value Parameters Registry -->
                        <div class="form-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <label style="margin-bottom: 0;">Configurações e Parâmetros API</label>
                                <button type="button" class="btn" onclick="addParamRow('', '')" style="padding: 4px 8px; font-size: 0.72rem; background: rgba(212,175,55,0.12); color: var(--accent-primary); border: 1px solid rgba(212,175,55,0.25);">➕ Adicionar Parâmetro</button>
                            </div>
                            <div id="dynamicParamsList" style="display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; padding: 4px; border: 1px dashed var(--glass-border); border-radius: var(--radius-sm); background: rgba(0,0,0,0.15);">
                                <!-- Rows appended here -->
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 20px;">
                            <label class="toggle-switch">
                                <input type="checkbox" id="provAtivo" checked>
                                <span class="switch-slider"></span>
                                <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);">Provedor Ativo (Disponível no Checkout)</span>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600; margin-top: 15px; padding: 12px;">SALVAR PROVEDOR</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userStr);
        if (user.perfil !== 'SUPER_ADMIN') {
            window.location.href = 'dashboard.html';
        }

        renderHeader('Olá, Super Admin!', 'Mapeamento e configuração dinâmica de gateways de pagamentos');

        function renderSidebar() {
            const nav = document.getElementById('navLinks');
            nav.innerHTML = `
                <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px;">SAAS PLATAFORMA</p>
                <a href="super-dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">📊 Plataforma Dashboard</a>
                <a href="super-empresas.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">🏢 Inquilinos (Empresas)</a>
                <a href="super-usuarios.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👥 Usuários Isolados</a>
                <a href="super-provedores.html" class="active" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">💳 Provedores de Pgto.</a>
                <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-top: 20px; margin-bottom: 10px;">PERFIL</p>
                <a href="meu-perfil.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👤 Meus Dados</a>
            `;
        }

        let registeredProviders = [];

        function onTipoSelection() {
            const tipo = document.getElementById('provTipo').value;
            const customGroup = document.getElementById('customTipoGroup');
            if (tipo === 'CUSTOM') {
                customGroup.style.display = 'block';
                document.getElementById('provTipoCustom').required = true;
            } else {
                customGroup.style.display = 'none';
                document.getElementById('provTipoCustom').required = false;
            }
        }

        // Adiciona linha dinâmica chave-valor
        function addParamRow(key = '', val = '') {
            const list = document.getElementById('dynamicParamsList');
            const row = document.createElement('div');
            row.className = 'dynamic-param-row animate-fade';
            row.innerHTML = `
                <input type="text" class="form-control param-key" placeholder="Parâmetro (ex: secret_key)" value="${key}" style="flex:1; font-family:monospace; font-size:0.75rem;" required>
                <input type="text" class="form-control param-val" placeholder="Valor/Credencial" value="${val}" style="flex:1; font-family:monospace; font-size:0.75rem;" required>
                <button type="button" class="btn" style="background:rgba(235, 77, 75, 0.12); color:var(--error); border:1px solid rgba(235, 77, 75, 0.25); padding: 8px 10px; flex-shrink:0;" onclick="this.parentNode.remove()">✕</button>
            `;
            list.appendChild(row);
        }

        function openProvedorModal(id = '') {
            document.getElementById('provedorForm').reset();
            document.getElementById('provedorId').value = id;
            document.getElementById('dynamicParamsList').innerHTML = '';
            document.getElementById('customTipoGroup').style.display = 'none';
            document.getElementById('provTipoCustom').required = false;

            if (id) {
                document.getElementById('provedorModalTitle').innerText = '✏️ Configurar Provedor';
                const prov = registeredProviders.find(p => p.id === id);
                if (prov) {
                    document.getElementById('provNome').value = prov.nome;
                    document.getElementById('provAtivo').checked = !!prov.ativo;

                    if (['STRIPE', 'ASAAS'].includes(prov.tipo)) {
                        document.getElementById('provTipo').value = prov.tipo;
                    } else {
                        document.getElementById('provTipo').value = 'CUSTOM';
                        document.getElementById('customTipoGroup').style.display = 'block';
                        document.getElementById('provTipoCustom').value = prov.tipo;
                        document.getElementById('provTipoCustom').required = true;
                    }

                    // Preenche chaves do config dinâmico
                    const configs = prov.configuracoes || {};
                    Object.keys(configs).forEach(k => {
                        addParamRow(k, configs[k]);
                    });
                }
            } else {
                document.getElementById('provedorModalTitle').innerText = '➕ Cadastrar Novo Provedor';
                document.getElementById('provAtivo').checked = true;
                // Templates padrão
                addParamRow('public_key', '');
                addParamRow('secret_key', '');
            }

            document.getElementById('provedorModal').classList.add('active');
        }

        function closeProvedorModal() {
            document.getElementById('provedorModal').classList.remove('active');
        }

        async function saveProvidersToBackend() {
            try {
                const res = await fetch('http://localhost:3001/api/super/configs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ provedores_pagamento_json: JSON.stringify(registeredProviders) })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                showToast('Configurações atualizadas na plataforma!', 'success');
            } catch (err) {
                console.error(err);
                showToast('Falha ao salvar no banco: ' + err.message, 'error');
            }
        }

        // Renderiza lista de provedores em formato de Cards Premium
        function renderProvidersCards() {
            const container = document.getElementById('providersGridContainer');
            container.innerHTML = '';

            if (registeredProviders.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px;">Nenhum provedor de pagamento configurado.</div>`;
                return;
            }

            registeredProviders.forEach(p => {
                const card = document.createElement('div');
                card.className = 'provider-card glass animate-fade';
                
                const typeClass = p.tipo === 'STRIPE' ? 'stripe' : p.tipo === 'ASAAS' ? 'asaas' : 'generic';
                const statusText = p.ativo ? 'Ativo' : 'Inativo';
                const statusClass = p.ativo ? 'active' : 'inactive';

                // Lista de chaves sem máscara
                const configsObj = p.configuracoes || {};
                const keysHtml = Object.keys(configsObj).map(k => {
                    const v = configsObj[k] || 'não definido';
                    return `<li class="provider-config-item"><span>${k}:</span><code>${v}</code></li>`;
                }).join('');

                card.innerHTML = `
                    <div>
                        <div class="provider-card-header">
                            <div>
                                <h3 class="provider-card-title">${p.nome}</h3>
                                <span class="badge-status ${statusClass}" style="margin-top: 5px; display: inline-block;">${statusText}</span>
                            </div>
                            <span class="provider-card-type ${typeClass}">${p.tipo}</span>
                        </div>
                        <div class="provider-card-body">
                            <ul class="provider-config-list">
                                ${keysHtml || '<li class="provider-config-item" style="font-style:italic;">Nenhum parâmetro de API cadastrado</li>'}
                            </ul>
                        </div>
                    </div>
                    <div class="provider-card-actions">
                        <button class="btn btn-sm" onclick="openProvedorModal('${p.id}')" style="background: rgba(255,255,255,0.08); color: var(--text-primary);">⚙️ CONFIGURAR</button>
                        <button class="btn btn-sm" onclick="toggleProvedorStatus('${p.id}')" style="background: rgba(212,175,55,0.12); color: var(--accent-primary); border: 1px solid rgba(212,175,55,0.25);">🔄 STATUS</button>
                        <button class="btn btn-sm" onclick="deletarProvedor('${p.id}')" style="background: rgba(235, 77, 75, 0.15); color: var(--error); border: 1px solid rgba(235, 77, 75, 0.3);">❌ EXCLUIR</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function toggleProvedorStatus(id) {
            const prov = registeredProviders.find(p => p.id === id);
            if (prov) {
                prov.ativo = !prov.ativo;
                await saveProvidersToBackend();
                renderProvidersCards();
            }
        }

        async function deletarProvedor(id) {
            if (!confirm('Deseja excluir este provedor permanentemente? Inquilinos não poderão utilizá-lo no checkout.')) return;
            registeredProviders = registeredProviders.filter(p => p.id !== id);
            await saveProvidersToBackend();
            renderProvidersCards();
        }

        async function fetchProviders() {
            try {
                const res = await fetch('http://localhost:3001/api/super/configs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    const c = data.configs;
                    if (c.provedores_pagamento_json) {
                        try {
                            registeredProviders = JSON.parse(c.provedores_pagamento_json);
                        } catch (e) {
                            registeredProviders = [];
                        }
                    }
                    
                    if (registeredProviders.length === 0) {
                        registeredProviders = [
                            {
                                id: 'stripe_default',
                                nome: 'Stripe Integrado',
                                tipo: 'STRIPE',
                                ativo: true,
                                configuracoes: { public_key: 'pk_test_stripe_mock', secret_key: 'sk_test_stripe_mock' }
                            },
                            {
                                id: 'asaas_default',
                                nome: 'Asaas Pix/Boleto',
                                tipo: 'ASAAS',
                                ativo: true,
                                configuracoes: { api_key: 'asaas_token_mock', webhook_secret: 'sec_asaas_mock' }
                            }
                        ];
                        await saveProvidersToBackend();
                    }

                    renderProvidersCards();
                }
            } catch (err) {
                showToast('Erro ao carregar provedores.', 'error');
            }
        }

        document.getElementById('provedorForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('provedorId').value;
            const nome = document.getElementById('provNome').value;
            const tipoSelecao = document.getElementById('provTipo').value;
            const tipo = tipoSelecao === 'CUSTOM' ? document.getElementById('provTipoCustom').value.toUpperCase().trim() : tipoSelecao;
            const ativo = document.getElementById('provAtivo').checked;

            // Compila chave-valor dinâmico
            const configuracoes = {};
            const keys = document.querySelectorAll('.param-key');
            const vals = document.querySelectorAll('.param-val');

            keys.forEach((kInput, i) => {
                const k = kInput.value.trim();
                const v = vals[i].value.trim();
                if (k) {
                    configuracoes[k] = v;
                }
            });

            if (id) {
                const index = registeredProviders.findIndex(p => p.id === id);
                if (index !== -1) {
                    registeredProviders[index] = { id, nome, tipo, ativo, configuracoes };
                }
            } else {
                const newId = 'prov_' + Date.now();
                registeredProviders.push({ id: newId, nome, tipo, ativo, configuracoes });
            }

            await saveProvidersToBackend();
            closeProvedorModal();
            renderProvidersCards();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            fetchProviders();
        });
    </script>
</body>
</html>
