<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Meu Extrato</title>
    <meta name="description" content="Visualize todas as suas movimentações de Talentos com filtros detalhados.">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .resumo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .resumo-card {
            padding: 20px;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
        }
        .resumo-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 14px 14px 0 0;
        }
        .resumo-card.disponivel { background: rgba(46,213,115,0.07); border: 1px solid rgba(46,213,115,0.2); }
        .resumo-card.disponivel::before { background: var(--success); }
        .resumo-card.areceber { background: rgba(255,165,0,0.07); border: 1px solid rgba(255,165,0,0.2); }
        .resumo-card.areceber::before { background: var(--warning); }
        .resumo-card.creditos { background: rgba(99,179,237,0.07); border: 1px solid rgba(99,179,237,0.2); }
        .resumo-card.creditos::before { background: #63b3ed; }
        .resumo-card.debitos { background: rgba(252,129,74,0.07); border: 1px solid rgba(252,129,74,0.2); }
        .resumo-card.debitos::before { background: var(--error); }
        .resumo-card .lbl {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .resumo-card .val {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: var(--font-heading);
        }
        .resumo-card.disponivel .val { color: var(--success); }
        .resumo-card.areceber .val { color: var(--warning); }
        .resumo-card.creditos .val { color: #63b3ed; }
        .resumo-card.debitos .val { color: var(--error); }

        /* Filtros e Tabela migrados para PremiumGrid */

        @keyframes shimmer {
            0% { opacity: 0.4; }
            50% { opacity: 0.9; }
            100% { opacity: 0.4; }
        }
        .loading-val { animation: shimmer 1.4s infinite; }
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo" style="font-size: 1.5rem; margin-bottom: 50px;">V-<span>TALENTOS</span></div>
            <nav id="navLinks" style="display: flex; flex-direction: column; gap: 15px;"></nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Cards de Resumo -->
            <div class="resumo-grid" id="resumoGrid">
                <div class="resumo-card disponivel glass">
                    <div class="lbl">💰 Saldo Disponível</div>
                    <div class="val loading-val" id="valDisponivel">—</div>
                </div>
                <div class="resumo-card areceber glass">
                    <div class="lbl">⏳ A Receber</div>
                    <div class="val loading-val" id="valAReceber">—</div>
                </div>
                <div class="resumo-card creditos glass">
                    <div class="lbl">📈 Total Créditos</div>
                    <div class="val loading-val" id="valCreditos">—</div>
                </div>
                <div class="resumo-card debitos glass">
                    <div class="lbl">📉 Total Débitos</div>
                    <div class="val loading-val" id="valDebitos">—</div>
                </div>
            </div>

            <!-- Componente PremiumGrid -->
            <section class="glass animate-fade" style="padding: 25px; margin-top: 30px; margin-bottom: 25px; animation-delay: 0.15s;">
                <div id="gridExtrato"></div>
            </section>
        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/premium-grid.js"></script>
    <script>
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');
        if (!token || !userStr) { window.location.href = 'login.html'; }

        const API_BASE = 'http://localhost:3001/api/auth';

        const origemLabel = {
            MANUAL: '✏️ Manual',
            IMPORTACAO: '📤 Importação',
            PREMIO: '🎁 Prêmio',
            RENOVACAO: '🔄 Renovação'
        };

        let extratoGrid = null;

        async function setupGrid() {
            extratoGrid = new PremiumGrid({
                containerId: 'gridExtrato',
                title: 'Histórico Geral de Movimentações',
                totalCountId: 'extratoTotalCount',
                columns: [
                    { key: 'created_at', label: 'Data / Hora', sortable: true },
                    { key: 'tipo', label: 'Tipo', align: 'center', sortable: true },
                    { key: 'origem', label: 'Origem', align: 'center', sortable: true },
                    { key: 'valor', label: 'Valor', align: 'right', sortable: true },
                    { key: 'status', label: 'Status', align: 'center', sortable: true },
                    { key: 'descricao', label: 'Empreendimento / Descrição', sortable: false },
                    { key: 'admin_nome', label: 'Lançado por', sortable: true }
                ],
                filters: [
                    { id: 'tipo', label: 'Tipo', type: 'select', options: [
                        {value: '', label: 'Todos'},
                        {value: 'CREDITO', label: 'Crédito (+)'},
                        {value: 'DEBITO', label: 'Débito (-)'},
                        {value: 'ESTORNO', label: 'Estorno (±)'}
                    ]},
                    { id: 'origem', label: 'Origem', type: 'select', options: [
                        {value: '', label: 'Todas'},
                        {value: 'MANUAL', label: '✏️ Manual'},
                        {value: 'IMPORTACAO', label: '📤 Importação'},
                        {value: 'PREMIO', label: '🎁 Prêmio'}
                    ]},
                    { id: 'status', label: 'Status', type: 'select', options: [
                        {value: '', label: 'Todos'},
                        {value: 'COMPENSADO', label: '✅ Compensado'},
                        {value: 'PENDENTE', label: '⏳ Pendente'},
                        {value: 'CANCELADO', label: '❌ Cancelado'}
                    ]},
                    { id: 'data_inicio', label: 'De (data)', type: 'date' },
                    { id: 'data_fim', label: 'Até (data)', type: 'date' }
                ],
                pagination: { enabled: true, defaultPageSize: 20, pageSizeOptions: [20, 50, 100] },
                cellRenderer: (row, col) => {
                    if (col.key === 'created_at') return `<span style="white-space:nowrap; font-size:0.8rem; color:var(--text-secondary);">${new Date(row.created_at).toLocaleString('pt-BR')}</span>`;
                    
                    if (col.key === 'tipo') return `<span class="badge badge-${row.tipo.toLowerCase()}" style="font-size:0.72rem;">${row.tipo}</span>`;
                    
                    if (col.key === 'origem') {
                        const origem = origemLabel[row.origem] || row.origem;
                        return `<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; background: rgba(255,255,255,0.06); color: var(--text-secondary);">${origem}</span>`;
                    }
                    
                    if (col.key === 'valor') {
                        const valorAbs = Math.abs(parseFloat(row.valor));
                        const isCred = row.tipo === 'CREDITO';
                        const isEst = row.tipo === 'ESTORNO';
                        const color = isCred ? 'var(--success)' : isEst ? 'var(--warning)' : 'var(--error)';
                        const sinal = isCred ? '+' : isEst ? '±' : '-';
                        return `<span style="color: ${color}; font-weight: 700; font-size: 0.95rem;">${sinal}${valorAbs.toFixed(2)} T$</span>`;
                    }
                    
                    if (col.key === 'status') {
                        const statusClass = (row.status || '').toLowerCase();
                        let bg = 'rgba(255,255,255,0.1)';
                        let color = 'var(--text-primary)';
                        if(statusClass === 'compensado') { bg = 'rgba(46,213,115,0.15)'; color = 'var(--success)'; }
                        if(statusClass === 'pendente') { bg = 'rgba(255,165,0,0.15)'; color = 'var(--warning)'; }
                        if(statusClass === 'cancelado') { bg = 'rgba(252,129,74,0.15)'; color = 'var(--error)'; }
                        
                        return `<span style="font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: ${bg}; color: ${color};">${row.status || '—'}</span>`;
                    }
                    
                    if (col.key === 'descricao') {
                        const descricao = row.empreendimento
                            ? `${row.empreendimento}${row.unidade ? ' / ' + row.unidade : ''}`
                            : (row.justificativa || '—');
                        return `<span style="display:inline-block; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary); font-size:0.8rem;" title="${descricao}">${descricao}</span>`;
                    }
                    
                    if (col.key === 'admin_nome') return `<span style="font-size:0.8rem; color:var(--text-secondary);">${row.admin_nome || '—'}</span>`;
                    
                    return row[col.key];
                },
                fetchFn: async (params) => {
                    const qsParams = new URLSearchParams({ page: params.page, limit: params.limit });
                    
                    if (params.filters.tipo) qsParams.append('tipo', params.filters.tipo);
                    if (params.filters.origem) qsParams.append('origem', params.filters.origem);
                    if (params.filters.status) qsParams.append('status', params.filters.status);
                    if (params.filters.data_inicio) qsParams.append('data_inicio', params.filters.data_inicio);
                    if (params.filters.data_fim) qsParams.append('data_fim', params.filters.data_fim);
                    if (params.sortBy) {
                        qsParams.append('sort_by', params.sortBy);
                        qsParams.append('sort_dir', params.sortDir);
                    }

                    const res = await fetch(`${API_BASE}/meu-extrato?${qsParams.toString()}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (res.status === 401) { logout(); return { rows: [], total: 0 }; }

                    const json = await res.json();
                    if (!json.success) throw new Error(json.error);

                    // Atualiza resumo
                    if (json.resumo) {
                        const r = json.resumo;
                        document.getElementById('valDisponivel').classList.remove('loading-val');
                        document.getElementById('valAReceber').classList.remove('loading-val');
                        document.getElementById('valCreditos').classList.remove('loading-val');
                        document.getElementById('valDebitos').classList.remove('loading-val');

                        document.getElementById('valDisponivel').innerText = `${r.saldo_disponivel.toFixed(2)} T$`;
                        document.getElementById('valAReceber').innerText = `${r.saldo_a_receber.toFixed(2)} T$`;
                        document.getElementById('valCreditos').innerText = `+${r.total_creditos.toFixed(2)} T$`;
                        document.getElementById('valDebitos').innerText = `-${r.total_debitos.toFixed(2)} T$`;
                    }

                    return { rows: json.data, total: json.meta.total };
                }
            });
            
            await extratoGrid.init();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderHeader('Meu Extrato', 'Histórico completo das suas movimentações de Talentos');
            setupGrid();
        });
    </script>
</body>
</html>
