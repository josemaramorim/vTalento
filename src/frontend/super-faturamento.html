<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Financeiro SaaS - V-Talentos</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Estilos e Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card-premium {
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .stat-card-premium::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .stat-card-premium .icon-box {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-card-premium .val {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: var(--font-heading);
            margin-bottom: 4px;
        }
        .stat-card-premium .lbl {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .selector-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: var(--radius-md);
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }
        .selector-box select {
            min-width: 200px;
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            cursor: pointer;
        }
        .selector-box select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        /* Tabela migrada para PremiumGrid no style.css global */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-success { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.2); }
        .badge-warning { background: rgba(241, 196, 15, 0.1); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.2); }
        .badge-essencial { background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.2); }
        .badge-profissional { background: rgba(155, 89, 182, 0.1); color: #9b59b6; border: 1px solid rgba(155, 89, 182, 0.2); }
        .badge-enterprise { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.2); }
        
        /* Paginação migrada para PremiumGrid no style.css global */
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">V-<span>TALENTOS</span></div>
            <nav id="navLinks">
                <!-- Injetado dinamicamente via JS -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <div class="page-header-actions animate-fade" style="margin-bottom: 25px;">
                <h1 style="font-size: 1.6rem; font-weight: 600;">💰 Histórico Financeiro & Saúde SaaS</h1>
            </div>

            <!-- KPIs de Faturamento -->
            <div class="dashboard-grid animate-fade" style="animation-delay: 0.05s;">
                <div class="stat-card-premium glass">
                    <div class="icon-box">🟢</div>
                    <div>
                        <div class="val" id="kpiTotalPago">R$ 0,00</div>
                        <div class="lbl">Total Recebido</div>
                    </div>
                </div>
                <div class="stat-card-premium glass">
                    <div class="icon-box" style="color: var(--accent-primary);">⏳</div>
                    <div>
                        <div class="val" id="kpiTotalPendente" style="color: var(--accent-primary);">R$ 0,00</div>
                        <div class="lbl">Total em Aberto</div>
                    </div>
                </div>
                <div class="stat-card-premium glass">
                    <div class="icon-box" style="color: #00f0ff;">📊</div>
                    <div>
                        <div class="val" id="kpiTotalGeral" style="color: #00f0ff;">R$ 0,00</div>
                        <div class="lbl">Volume Faturado</div>
                    </div>
                </div>
            </div>

            <!-- Painel de Filtros -->
            <section class="glass animate-fade" style="padding: 25px; margin-top: 20px; margin-bottom: 25px; animation-delay: 0.1s;">
                <div id="gridFaturas"></div>
            </section>
        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/premium-grid.js"></script>
    <script>
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userStr);
        if (user.perfil !== 'SUPER_ADMIN') {
            window.location.href = 'dashboard.html';
        }

        // Renderiza o cabeçalho dinâmico do Super-Admin
        renderHeader('Histórico Financeiro SaaS', 'Métricas, faturamento acumulado, quitações manuais e controle de faturas multi-tenant');

        // Renderiza Sidebar
        const nav = document.getElementById('navLinks');
        nav.innerHTML = `
            <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px;">SAAS PLATAFORMA</p>
            <a href="super-dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">📊 Plataforma Dashboard</a>
            <a href="super-empresas.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">🏢 Inquilinos (Empresas)</a>
            <a href="super-usuarios.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👥 Usuários Isolados</a>
            <a href="super-faturamento.html" class="active" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">💰 Faturamento SaaS</a>
            <a href="super-provedores.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">💳 Provedores de Pgto.</a>
            <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-top: 20px; margin-bottom: 10px;">PERFIL</p>
            <a href="meu-perfil.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👤 Meus Dados</a>
        `;

        const urlParams = new URLSearchParams(window.location.search);
        let selectedEmpresaId = urlParams.get('empresa_id') || '';

        let faturasGrid = null;

        // Carregar a lista de inquilinos para o dropdown de filtros
        async function carregarInquilinosDropdown() {
            try {
                const res = await fetch('http://localhost:3001/api/super/empresas?limit=100', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);

                const inquilinosOptions = [{ value: '', label: 'Todos os inquilinos (Sem filtro)...' }];
                data.data.forEach(emp => {
                    inquilinosOptions.push({ value: emp.id, label: emp.nome });
                });
                
                setupGrid(inquilinosOptions);
            } catch (err) {
                console.error(err);
                showToast('Erro ao carregar lista de inquilinos.', 'error');
            }
        }

        async function setupGrid(inquilinosOptions) {
            faturasGrid = new PremiumGrid({
                containerId: 'gridFaturas',
                title: 'Histórico Financeiro SaaS',
                totalCountId: 'superFaturasTotalCount',
                columns: [
                    { key: 'fatura_id', label: 'Fatura ID', sortable: true },
                    { key: 'empresa_nome', label: 'Inquilino (Empresa)', bold: true, sortable: true },
                    { key: 'plano', label: 'Plano', align: 'center', sortable: true },
                    { key: 'valor', label: 'Valor', sortable: true },
                    { key: 'status', label: 'Status', align: 'center', sortable: true },
                    { key: 'data_vencimento', label: 'Vencimento', sortable: true },
                    { key: 'data_pagamento', label: 'Pagamento', sortable: true },
                    { key: 'acoes', label: 'Ações', align: 'right' }
                ],
                filters: [
                    { id: 'empresaId', label: 'Filtrar por Inquilino (Empresa)', type: 'select', options: inquilinosOptions, value: selectedEmpresaId },
                    { id: 'status', label: 'Status da Fatura', type: 'select', options: [
                        {value: '', label: 'Todos os status...'}, 
                        {value: 'PENDENTE', label: 'PENDENTE'}, 
                        {value: 'PAGA', label: 'PAGA'}
                    ]}
                ],
                pagination: { enabled: true, defaultPageSize: 10, pageSizeOptions: [10, 50, 100] },
                cellRenderer: (row, col) => {
                    if (col.key === 'fatura_id') return `<span style="font-family: monospace; font-size: 0.85rem; color: var(--text-secondary);">${row.id.slice(0, 8)}...</span>`;
                    if (col.key === 'empresa_nome') return `<strong style="font-weight: 600;">${row.empresa_nome}</strong>`;
                    if (col.key === 'plano') {
                        const badgeClass = row.empresa_plano === 'ESSENCIAL' ? 'badge-essencial' : (row.empresa_plano === 'PROFISSIONAL' ? 'badge-profissional' : 'badge-enterprise');
                        return `<span class="badge ${badgeClass}">${row.empresa_plano}</span>`;
                    }
                    if (col.key === 'valor') {
                        const formattedValue = parseFloat(row.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        return `<span style="font-weight: 600; color: ${row.status === 'PAGA' ? '#2ecc71' : 'var(--accent-primary)'}">${formattedValue}</span>`;
                    }
                    if (col.key === 'status') {
                        const badgeClass = row.status === 'PAGA' ? 'badge-success' : 'badge-warning';
                        return `<span class="badge ${badgeClass}">${row.status}</span>`;
                    }
                    if (col.key === 'data_vencimento') return new Date(row.data_vencimento).toLocaleDateString('pt-BR');
                    if (col.key === 'data_pagamento') return row.data_pagamento ? new Date(row.data_pagamento).toLocaleDateString('pt-BR') : '-';
                    
                    if (col.key === 'acoes') {
                        if (row.status !== 'PAGA') {
                            return `<button type="button" class="btn btn-secondary btn-sm" onclick="baixarFatura('${row.id}')" style="padding: 5px 10px; font-size: 0.8rem; font-weight: 600; background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.25); cursor: pointer; border-radius: 4px; transition: all 0.3s;">✔️ QUITAR</button>`;
                        } else {
                            return `<span style="color: var(--text-secondary); font-size: 0.85rem; font-style: italic;">Quitado</span>`;
                        }
                    }
                    return row[col.key];
                },
                fetchFn: async (params) => {
                    let url = `http://localhost:3001/api/super/faturas?page=${params.page}&limit=${params.limit}`;
                    if (params.filters.empresaId) url += `&empresaId=${params.filters.empresaId}`;
                    if (params.filters.status) url += `&status=${params.filters.status}`;

                    if (params.sortBy) url += `&sort_by=${encodeURIComponent(params.sortBy)}&sort_dir=${encodeURIComponent(params.sortDir)}`;

                    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await res.json();
                    if (!data.success) throw new Error(data.error);

                    // Atualiza os KPIs Globais de Super Admin
                    if (data.stats) {
                        document.getElementById('kpiTotalPago').textContent = data.stats.total_pago.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        document.getElementById('kpiTotalPendente').textContent = data.stats.total_pendente.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        document.getElementById('kpiTotalGeral').textContent = data.stats.total_geral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    }

                    return { rows: data.data, total: data.meta.total };
                }
            });
            await faturasGrid.init();
        }

        async function baixarFatura(faturaId) {
            if (!confirm('Deseja realmente dar baixa manual nesta fatura? Esta ação é irreversível e estenderá o licenciamento da empresa por mais 30 dias.')) {
                return;
            }

            try {
                const res = await fetch(`http://localhost:3001/api/super/faturas/${faturaId}/baixa`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);

                showToast('Fatura quitada e licença da empresa prorrogada com sucesso!', 'success');
                if (faturasGrid) faturasGrid.refresh();
            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
            }
        }

        async function init() {
            await carregarInquilinosDropdown();
        }

        init();
    </script>
</body>
</html>
