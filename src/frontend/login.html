<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Login Universal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/img/bg-login.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--accent-secondary);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--text-primary);
            font-weight: 300;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            margin-top: 10px;
        }

        .footer-links {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .footer-links a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        /* Theme Toggle Position */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }
    </style>
</head>
<body data-theme="dark">
    <button class="theme-toggle" id="themeToggle" title="Alternar Tema">🌓</button>

    <div class="login-card glass">
        <div class="logo">V-<span>TALENTOS</span></div>
        <p class="subtitle">Portal de Gamificação & Recompensas</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com.br" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login">ENTRAR NO SISTEMA</button>
        </form>

        <div class="footer-links">
            Esqueceu sua senha? <a href="#">Recuperar Acesso</a>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        // Simple Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.setAttribute('data-theme', savedTheme);
        }
    </script>
</body>
</html>
