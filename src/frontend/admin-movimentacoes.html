<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Movimentações da Equipe</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .resumo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .resumo-card {
            padding: 20px;
            border-radius: var(--radius-md);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .resumo-card:hover {
            transform: translateY(-2px);
        }
        .resumo-card p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .resumo-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
        }
        /* Estilos do JSON Tree Viewer */
        .json-viewer-container {
            background: #0d0e12;
            border: 1px solid #1f2330;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
        }
        .json-key { color: #e06c75; }
        .json-string { color: #98c379; }
        .json-number { color: #d19a66; }
        .json-boolean { color: #d19a66; font-weight: bold; }
        .json-null { color: #5c6370; font-style: italic; }
        .json-brace { color: #abb2bf; }
        .json-toggle {
            display: inline-block;
            width: 14px;
            text-align: center;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo" style="font-size: 1.5rem; margin-bottom: 50px;">V-<span>TALENTOS</span></div>
            <nav id="navLinks" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Sidebar preenchido dinamicamente no script -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Cards Resumo Consolidado -->
            <section class="resumo-grid">
                <div class="resumo-card glass" style="background: rgba(46,213,115,0.06); border: 1px solid rgba(46,213,115,0.15);">
                    <p>💰 Saldo Disponível Equipe</p>
                    <h3 style="color: var(--success);" id="cardDispTotal">0.00 T$</h3>
                </div>
                <div class="resumo-card glass" style="background: rgba(255,165,0,0.06); border: 1px solid rgba(255,165,0,0.15);">
                    <p>⏳ Saldo a Receber Equipe</p>
                    <h3 style="color: var(--warning);" id="cardRecTotal">0.00 T$</h3>
                </div>
                <div class="resumo-card glass" style="background: rgba(54,162,235,0.06); border: 1px solid rgba(54,162,235,0.15);">
                    <p>📈 Total Créditos Lançados</p>
                    <h3 style="color: #36a2eb;" id="cardCredTotal">0.00 T$</h3>
                </div>
                <div class="resumo-card glass" style="background: rgba(255,99,132,0.06); border: 1px solid rgba(255,99,132,0.15);">
                    <p>📉 Total Débitos Lançados</p>
                    <h3 style="color: #ff6384;" id="cardDebTotal">0.00 T$</h3>
                </div>
            </section>

            <!-- Componente PremiumGrid -->
            <section class="glass" style="padding: 25px; margin-bottom: 25px;">
                <div id="gridMovimentacoes"></div>
            </section>
        </main>
    </div>

    <!-- MODAL DE DETALHES -->
    <div id="detalhesModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1001; align-items:center; justify-content:center; padding: 20px; backdrop-filter: blur(10px);">
        <div class="glass" style="max-width:550px; width:100%; border-radius:16px; padding:32px; border:1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;">
                <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin:0;">Detalhes do Lançamento</h3>
                <button onclick="closeDetalhesModal()" style="background:none; border:none; color:var(--text-secondary); font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div id="detalhesContent" style="display: flex; flex-direction: column; gap: 15px; font-size: 0.95rem;">
                <!-- Preenchido via JS -->
            </div>
            <div style="margin-top: 25px; text-align: right;">
                <button onclick="closeDetalhesModal()" class="btn" style="background: rgba(255,255,255,0.08); color: var(--text-primary); padding: 10px 24px; border-radius: 8px;">Fechar</button>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/premium-grid.js"></script>
    <script>
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const currentUser = JSON.parse(userStr);
        const isAdmin = currentUser.perfil === 'ADMIN_EMPRESA' || currentUser.perfil === 'SUPER_ADMIN';

        if (!isAdmin) {
            window.location.href = 'dashboard.html';
        }

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }



        const API_BASE = 'http://localhost:3001/api/admin';
        let globalGrid = null;

        async function populateCorretoresDropdown() {
            try {
                const response = await fetch(`${API_BASE}/corretores`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error();
                const corretores = await response.json();
                
                // Return options array for PremiumGrid filter
                return corretores.map(c => ({ value: c.id, label: c.nome }));
            } catch (err) {
                console.error('Erro ao popular corretores:', err);
                return [];
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            renderHeader("Movimentações da Equipe", "Acompanhe e filtre todo o histórico financeiro e de transações da sua equipe em tempo real");
            
            const corretoresOptions = await populateCorretoresDropdown();
            
            // Verifica se há filtro de corretor vindo da URL
            const urlParams = new URLSearchParams(window.location.search);
            const initialCorretor = urlParams.get('usuario_id') || '';

            globalGrid = new PremiumGrid({
                containerId: 'gridMovimentacoes',
                title: 'Histórico Geral de Lançamentos',
                totalCountId: 'paginacaoInfo', // reaproveitando IDs para o titulo
                
                columns: [
                    { key: 'corretor_nome', label: 'Corretor', bold: true, sortable: true },
                    { key: 'tipo', label: 'Tipo', type: 'badge' },
                    { key: 'valor_formatado', label: 'Valor', align: 'right', sortable: true },
                    { key: 'descricao', label: 'Justificativa / Empreendimento' },
                    { key: 'data_vencimento', label: 'Vencimento', align: 'center', sortable: true },
                    { key: 'data_compensacao', label: 'Compensação', align: 'center', sortable: true },
                    { key: 'status', label: 'Status', align: 'center' },
                    { key: 'acoes', label: 'Ações', align: 'center' }
                ],
                
                filters: [
                    { id: 'usuario_id', label: 'Corretor', type: 'select', options: corretoresOptions },
                    { id: 'tipo', label: 'Tipo', type: 'select', options: [
                        { value: 'CREDITO', label: 'Crédito (+)' },
                        { value: 'DEBITO', label: 'Débito (-)' },
                        { value: 'ESTORNO', label: 'Estorno (±)' }
                    ]},
                    { id: 'origem', label: 'Origem', type: 'select', options: [
                        { value: 'MANUAL', label: 'Manual ✏️' },
                        { value: 'IMPORTACAO', label: 'Importação 📤' },
                        { value: 'PREMIO', label: 'Prêmio 🎁' }
                    ]},
                    { id: 'status', label: 'Status', type: 'select', options: [
                        { value: 'PENDENTE', label: 'Pendente' },
                        { value: 'COMPENSADO', label: 'Compensado' },
                        { value: 'CANCELADO', label: 'Cancelado' }
                    ]},
                    { id: 'data_inicio', label: 'Vencimento De', type: 'date' },
                    { id: 'data_fim', label: 'Vencimento Até', type: 'date' }
                ],
                
                pagination: { enabled: true, defaultPageSize: 10, pageSizeOptions: [10, 50, 100] },
                
                // summary configs currently disabled as API doesn't return per-column summary for this specific layout, 
                // it returns a global `resumo` which we update separately.
                
                cellRenderer: (row, col) => {
                    const formatarData = (dt) => {
                        if (!dt) return '—';
                        const d = new Date(dt);
                        return d.toLocaleDateString('pt-BR', { timeZone: 'UTC' }); // Assumindo YYYY-MM-DD
                    };

                    if (col.key === 'data_vencimento') return formatarData(row.data_vencimento);
                    if (col.key === 'data_compensacao') return formatarData(row.data_compensacao);
                    
                    if (col.key === 'status') {
                        const dictStatus = { 
                            'PENDENTE': '<span class="badge" style="background: rgba(255,165,0,0.15); color: var(--warning);">Pendente</span>',
                            'COMPENSADO': '<span class="badge" style="background: rgba(46,213,115,0.15); color: var(--success);">Compensado</span>',
                            'CANCELADO': '<span class="badge" style="background: rgba(235,77,75,0.15); color: var(--error);">Cancelado</span>'
                        };
                        return dictStatus[row.status] || row.status || '—';
                    }
                    if (col.key === 'valor_formatado') {
                        const isCred = row.tipo === 'CREDITO';
                        const isEst = row.tipo === 'ESTORNO';
                        const cor = isCred ? 'var(--success)' : isEst ? 'var(--warning)' : 'var(--error)';
                        const sinal = isCred ? '+' : isEst ? '±' : '-';
                        return `<strong style="color: ${cor}; font-size: 0.95rem;">${sinal}${Math.abs(parseFloat(row.valor)).toFixed(2)} T$</strong>`;
                    }
                    if (col.key === 'descricao') {
                        const desc = row.empreendimento 
                            ? `${row.empreendimento}${row.unidade ? ' / Unidade ' + row.unidade : ''}` 
                            : (row.justificativa || '—');
                        return `<div style="max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8rem; color: var(--text-secondary);" title="${desc}">${desc}</div>`;
                    }
                    if (col.key === 'acoes') {
                        return `<button class="btn btn-sm" onclick="showDetalhesModal('${row.id}')" style="background: rgba(255,255,255,0.1); color: var(--text-primary); padding: 4px 8px; font-size: 0.75rem;">Detalhes</button>`;
                    }
                    return row[col.key];
                },
                
                fetchFn: async (params) => {
                    // Update global UI with Loading
                    document.getElementById('cardDispTotal').textContent = '...';
                    document.getElementById('cardRecTotal').textContent = '...';
                    document.getElementById('cardCredTotal').textContent = '...';
                    document.getElementById('cardDebTotal').textContent = '...';

                    const queryParams = new URLSearchParams({
                        page: params.page,
                        limit: params.limit,
                        ...(params.filters.tipo && { tipo: params.filters.tipo }),
                        ...(params.filters.origem && { origem: params.filters.origem }),
                        ...(params.filters.status && { status: params.filters.status }),
                        ...(params.filters.usuario_id && { usuario_id: params.filters.usuario_id }),
                        ...(params.filters.data_inicio && { data_inicio: params.filters.data_inicio }),
                        ...(params.filters.data_fim && { data_fim: params.filters.data_fim })
                    });
                    
                    if (params.sortBy) {
                        queryParams.append('sort_by', params.sortBy);
                        queryParams.append('sort_dir', params.sortDir);
                    }

                    const response = await fetch(`${API_BASE}/movimentacoes?${queryParams}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.status === 401) { logout(); return; }

                    const resData = await response.json();
                    if (!resData.success) throw new Error(resData.error || 'Erro ao carregar movimentações');

                    // Atualizar Cards Consolidado Global
                    if(resData.resumo) {
                        document.getElementById('cardDispTotal').textContent = `${parseFloat(resData.resumo.saldo_disponivel_total).toFixed(2)} T$`;
                        document.getElementById('cardRecTotal').textContent = `${parseFloat(resData.resumo.saldo_a_receber_total).toFixed(2)} T$`;
                        document.getElementById('cardCredTotal').textContent = `${parseFloat(resData.resumo.creditos_total).toFixed(2)} T$`;
                        document.getElementById('cardDebTotal').textContent = `${parseFloat(resData.resumo.debitos_total).toFixed(2)} T$`;
                    }

                    return {
                        rows: resData.data,
                        total: resData.meta.total
                    };
                }
            });

            // Set initial filter if provided by URL
            if (initialCorretor) {
                globalGrid.state.filters.usuario_id = initialCorretor;
                // Wait for render, then set the DOM value so the UI reflects it
                setTimeout(() => {
                    const el = document.getElementById(`gridMovimentacoes-filter-usuario_id`);
                    if(el) el.value = initialCorretor;
                }, 100);
            }

            await globalGrid.init();
        });

        function showDetalhesModal(id) {
            if (!globalGrid) return;
            const row = globalGrid.state.data.find(r => r.id === id);
            if (!row) return;

            const isCred = row.tipo === 'CREDITO';
            const isEst = row.tipo === 'ESTORNO';
            const cor = isCred ? 'var(--success)' : isEst ? 'var(--warning)' : 'var(--error)';
            const sinal = isCred ? '+' : isEst ? '±' : '-';
            const valFormated = `<strong style="color: ${cor}; font-size: 1.2rem;">${sinal}${Math.abs(parseFloat(row.valor)).toFixed(2)} T$</strong>`;

            const dictOrigem = { MANUAL: '✏️ Manual', IMPORTACAO: '📤 Importação', PREMIO: '🎁 Prêmio', RENOVACAO: '🔄 Renovação' };
            const origemFormatada = dictOrigem[row.origem] || row.origem;
            
            let parsedExtras = null;
            if (row.dados_extras) {
                try {
                    parsedExtras = typeof row.dados_extras === 'string'
                        ? JSON.parse(row.dados_extras)
                        : row.dados_extras;
                } catch (e) {}
            }

            let dadosExtrasHtml = '';
            if (parsedExtras && Object.keys(parsedExtras).length > 0) {
                dadosExtrasHtml = `
                    <div style="margin-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px;">
                        <button onclick="toggleDadosExtrasPanel()" class="btn btn-sm" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(212,175,55,0.05); border-color: rgba(212,175,55,0.2); color: var(--accent-primary); padding: 8px 12px; font-size: 0.8rem; border-radius: 6px; cursor: pointer; transition: all 0.2s;">
                            <span>📋 Ver Metadados Avançados (dados_extras JSON)</span>
                            <span id="dadosExtrasArrow">▼</span>
                        </button>
                        <div id="dadosExtrasPanel" style="display: none; margin-top: 10px;">
                            <div class="json-viewer-container">
                                ${formatJSONTree(parsedExtras)}
                            </div>
                        </div>
                    </div>
                `;
            }

            const html = `
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between;"><strong style="color:var(--text-secondary);">ID do Lançamento:</strong> <span>${row.id}</span></div>
                    <div style="display: flex; justify-content: space-between;"><strong style="color:var(--text-secondary);">Data/Hora:</strong> <span>${new Date(row.created_at).toLocaleString('pt-BR')}</span></div>
                    <div style="display: flex; justify-content: space-between;"><strong style="color:var(--text-secondary);">Corretor:</strong> <span>${row.corretor_nome || '—'}</span></div>
                    <div style="display: flex; justify-content: space-between;"><strong style="color:var(--text-secondary);">Tipo:</strong> <span>${row.tipo}</span></div>
                    <div style="display: flex; justify-content: space-between;"><strong style="color:var(--text-secondary);">Origem:</strong> <span>${origemFormatada}</span></div>
                    <div style="display: flex; justify-content: space-between;"><strong style="color:var(--text-secondary);">Status:</strong> <span>${row.status || '—'}</span></div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1);"><strong style="color:var(--text-secondary);">Valor:</strong> ${valFormated}</div>
                    
                    <div style="margin-top: 10px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                        <strong style="color:var(--text-secondary); display:block; margin-bottom: 5px;">Justificativa / Empreendimento:</strong>
                        <div style="color: var(--text-primary); line-height: 1.5;">${row.empreendimento ? `Empreendimento: ${row.empreendimento}<br>` : ''}${row.unidade ? `Unidade: ${row.unidade}<br>` : ''}${row.justificativa || 'Sem justificativa'}</div>
                    </div>
                    
                    ${row.admin_nome ? `<div style="display: flex; justify-content: space-between; margin-top: 10px;"><strong style="color:var(--text-secondary);">Lançado por (Admin):</strong> <span>${row.admin_nome}</span></div>` : ''}
                    
                    ${dadosExtrasHtml}
                </div>
            `;

            document.getElementById('detalhesContent').innerHTML = html;
            document.getElementById('detalhesModal').style.display = 'flex';
        }

        function closeDetalhesModal() {
            document.getElementById('detalhesModal').style.display = 'none';
        }

        function toggleDadosExtrasPanel() {
            const panel = document.getElementById('dadosExtrasPanel');
            const arrow = document.getElementById('dadosExtrasArrow');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                arrow.textContent = '▲';
            } else {
                panel.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        function formatJSONTree(obj) {
            if (obj === null || obj === undefined) return '<span class="json-null">null</span>';
            
            if (typeof obj !== 'object') {
                const type = typeof obj;
                if (type === 'string') {
                    return `<span class="json-string">"${escapeHtml(obj)}"</span>`;
                }
                if (type === 'number') {
                    return `<span class="json-number">${obj}</span>`;
                }
                if (type === 'boolean') {
                    return `<span class="json-boolean">${obj}</span>`;
                }
                return `<span>${escapeHtml(String(obj))}</span>`;
            }

            const isArray = Array.isArray(obj);
            const openBrace = isArray ? '[' : '{';
            const closeBrace = isArray ? ']' : '}';
            const keys = Object.keys(obj);

            if (keys.length === 0) {
                return `<span>${openBrace}${closeBrace}</span>`;
            }

            let html = `<span class="json-brace">${openBrace}</span>`;
            html += `<div class="json-tree-node">`;
            
            keys.forEach((key, idx) => {
                const val = obj[key];
                const isCollapsible = val !== null && typeof val === 'object';
                const comma = idx < keys.length - 1 ? ',' : '';
                
                html += `<div class="json-tree-row" style="margin-left: 15px; position: relative; line-height: 1.5;">`;
                if (isCollapsible) {
                    html += `<span class="json-toggle" onclick="event.stopPropagation(); toggleJSONNode(this)" style="cursor: pointer; font-size: 0.8rem; margin-right: 5px; color: var(--accent-primary); user-select: none;">[-]</span>`;
                    html += `<span class="json-key" style="color: #61afef; font-weight: 600;">"${escapeHtml(key)}"</span>: `;
                    html += `<div class="json-collapsible-content" style="display: block; transition: all 0.2s ease;">`;
                    html += formatJSONTree(val);
                    html += `</div>`;
                } else {
                    html += `<span style="display: inline-block; width: 14px;"></span>`;
                    html += `<span class="json-key" style="color: #e06c75;">"${escapeHtml(key)}"</span>: `;
                    html += formatJSONTree(val);
                }
                html += `<span>${comma}</span>`;
                html += `</div>`;
            });
            
            html += `</div>`;
            html += `<span class="json-brace">${closeBrace}</span>`;
            return html;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function toggleJSONNode(el) {
            const parent = el.parentElement;
            const content = parent.querySelector('.json-collapsible-content');
            if (content) {
                if (content.style.display === 'none') {
                    content.style.display = 'block';
                    el.textContent = '[-]';
                } else {
                    content.style.display = 'none';
                    el.textContent = '[+]';
                }
            }
        }
    </script>
</body>
</html>
