<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Vitrine de Prêmios</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .actions-btn {
            display: flex;
            gap: 10px;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
        }
        .badge-ativo { background: rgba(0, 255, 0, 0.1); color: var(--success); }
        .badge-inativo { background: rgba(255, 0, 0, 0.1); color: var(--error); }
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo" style="font-size: 1.5rem; margin-bottom: 50px;">V-<span>TALENTOS</span></div>
            <nav id="navLinks" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Preenchido dinamicamente no script -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Formulário de Prêmio -->
            <section class="form-card glass">
                <h2 id="formTitle" style="font-size: 1.2rem; margin-bottom: 20px; color: var(--accent-primary);">Novo Prêmio</h2>
                <form id="premioForm">
                    <input type="hidden" id="premioId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tituloInput">Título do Prêmio</label>
                            <input type="text" id="tituloInput" placeholder="Ex: Voucher iFood R$ 50" required>
                        </div>
                        <div class="form-group">
                            <label for="descricaoInput">Descrição</label>
                            <textarea id="descricaoInput" rows="1" placeholder="Detalhes do prêmio..." required></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantidadeInput">Estoque (Unidades)</label>
                            <input type="number" id="quantidadeInput" min="0" placeholder="Ex: 10" required>
                        </div>
                        <div class="form-group">
                            <label for="custoInput">Custo (Talentos)</label>
                            <input type="number" id="custoInput" min="1" placeholder="Ex: 500" required>
                        </div>
                        <div class="form-group" style="justify-content: center; align-items: center; display: flex; flex-direction: row; gap: 10px;">
                            <label for="ativoInput" style="margin: 0;">Ativo para Resgate?</label>
                            <input type="checkbox" id="ativoInput" checked style="width: 20px; height: 20px; accent-color: var(--accent-primary);">
                        </div>
                    </div>

                    <div style="text-align: right; display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" class="btn" id="btnCancelEdit" style="display: none; background: var(--bg-card); color: var(--text-primary);" onclick="resetForm()">CANCELAR</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit">SALVAR PRÊMIO</button>
                    </div>
                </form>
            </section>

            <!-- Catálogo Atual com PremiumGrid -->
            <section class="glass" style="padding: 25px; margin-top: 30px;">
                <div id="gridCatalogoPremios"></div>
            </section>
        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/premium-grid.js"></script>
    <script>
        // Check Admin Auth
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(userStr);
            if (user.perfil !== 'ADMIN_EMPRESA' && user.perfil !== 'SUPER_ADMIN') {
                showToast('Acesso restrito a administradores.', 'error');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            }
        }

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }



        // API Integration
        const API_BASE = 'http://localhost:3001/api/admin';
        let statePremios = [];

        let grid = null;

        // Form Submit
        document.getElementById('premioForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('premioId').value;
            const titulo = document.getElementById('tituloInput').value;
            const descricao = document.getElementById('descricaoInput').value;
            const quantidade_disponivel = parseInt(document.getElementById('quantidadeInput').value, 10);
            const custo_pontos = parseInt(document.getElementById('custoInput').value, 10);
            const ativo = document.getElementById('ativoInput').checked;
            
            const btnSubmit = document.getElementById('btnSubmit');

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerText = 'PROCESSANDO...';

                const url = id ? `${API_BASE}/premios/${id}` : `${API_BASE}/premios`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ titulo, descricao, quantidade_disponivel, custo_pontos, ativo })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Erro ao salvar prêmio');
                }

                showToast(id ? 'Prêmio atualizado com sucesso!' : 'Prêmio criado com sucesso!', 'success');
                resetForm();
                if (grid) await grid.refresh();

            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = id ? 'ATUALIZAR PRÊMIO' : 'SALVAR PRÊMIO';
            }
        });

        function editPremio(id) {
            const premio = statePremios.find(p => p.id === id);
            if (!premio) return;

            document.getElementById('formTitle').innerText = 'Editar Prêmio #' + id;
            document.getElementById('premioId').value = premio.id;
            document.getElementById('tituloInput').value = premio.titulo;
            document.getElementById('descricaoInput').value = premio.descricao;
            document.getElementById('quantidadeInput').value = premio.quantidade_disponivel;
            document.getElementById('custoInput').value = premio.custo_pontos;
            document.getElementById('ativoInput').checked = premio.ativo;

            document.getElementById('btnSubmit').innerText = 'ATUALIZAR PRÊMIO';
            document.getElementById('btnCancelEdit').style.display = 'inline-block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePremio(id) {
            if (!confirm('Deseja inativar/excluir este prêmio?')) return;

            try {
                const response = await fetch(`${API_BASE}/premios/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Erro ao excluir prêmio');
                }

                showToast('Prêmio removido/inativado com sucesso.', 'success');
                if (grid) await grid.refresh();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = 'Novo Prêmio';
            document.getElementById('premioForm').reset();
            document.getElementById('premioId').value = '';
            document.getElementById('btnSubmit').innerText = 'SALVAR PRÊMIO';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        // Init
        window.addEventListener('DOMContentLoaded', async () => {
            renderHeader("Vitrine de Prêmios", "Gerencie o catálogo de recompensas disponíveis para resgate");
            
            grid = new PremiumGrid({
                containerId: 'gridCatalogoPremios',
                title: 'Catálogo de Prêmios Cadastrados',
                totalCountId: 'premiosTotalCount',
                columns: [
                    { key: 'id', label: 'ID', width: '80px' },
                    { key: 'titulo', label: 'Título', bold: true, sortable: true },
                    { key: 'quantidade_disponivel', label: 'Estoque', sortable: true },
                    { key: 'custo_pontos', label: 'Custo', highlight: true, sortable: true },
                    { key: 'ativo_badge', label: 'Status', align: 'center' },
                    { key: 'acoes', label: 'Ações', align: 'center' }
                ],
                filters: [
                    { id: 'busca', label: 'Pesquisar por Título ou Descrição', type: 'text' },
                    { id: 'ativo', label: 'Status', type: 'select', options: [
                        { value: 'true', label: 'Ativo' },
                        { value: 'false', label: 'Inativo' }
                    ]}
                ],
                pagination: { enabled: true, defaultPageSize: 10, pageSizeOptions: [10, 50, 100] },
                cellRenderer: (row, col) => {
                    if (col.key === 'id') return `#${row.id}`;
                    if (col.key === 'quantidade_disponivel') return `${row.quantidade_disponivel} un.`;
                    if (col.key === 'custo_pontos') return `<strong style="color: var(--accent-primary)">${row.custo_pontos} T$</strong>`;
                    if (col.key === 'ativo_badge') {
                        const badgeClass = row.ativo ? 'badge-ativo' : 'badge-inativo';
                        const statusText = row.ativo ? 'ATIVO' : 'INATIVO';
                        return `<span class="badge ${badgeClass}">${statusText}</span>`;
                    }
                    if (col.key === 'acoes') {
                        return `
                            <div class="actions-btn" style="justify-content: center;">
                                <button class="btn btn-sm" onclick="editPremio(${row.id})" style="background: rgba(255,255,255,0.1); color: var(--text-primary); padding: 4px 8px; font-size: 0.75rem;">Editar</button>
                                <button class="btn btn-sm" onclick="deletePremio(${row.id})" style="background: rgba(255,0,0,0.1); color: var(--error); padding: 4px 8px; font-size: 0.75rem;">Excluir</button>
                            </div>
                        `;
                    }
                    return row[col.key];
                },
                fetchFn: async (params) => {
                    const response = await fetch(`${API_BASE}/premios`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const resData = await response.json();
                    if (!resData.success) throw new Error(resData.error || 'Erro ao carregar prêmios');
                    
                    let rows = resData.data || [];
                    statePremios = rows; // keep local state for form editing

                    // Client-side text search
                    if (params.filters.busca) {
                        const query = params.filters.busca.toLowerCase();
                        rows = rows.filter(r => 
                            String(r.titulo).toLowerCase().includes(query) || 
                            String(r.descricao).toLowerCase().includes(query)
                        );
                    }

                    // Client-side status filter
                    if (params.filters.ativo) {
                        const filterVal = params.filters.ativo === 'true';
                        rows = rows.filter(r => r.ativo === filterVal);
                    }

                    // Client-side sorting
                    if (params.sortBy) {
                        rows.sort((a, b) => {
                            let valA = a[params.sortBy];
                            let valB = b[params.sortBy];
                            
                            if (params.sortBy === 'custo_pontos' || params.sortBy === 'quantidade_disponivel') {
                                return params.sortDir === 'asc' ? valA - valB : valB - valA;
                            }
                            
                            if (typeof valA === 'string') valA = valA.toLowerCase();
                            if (typeof valB === 'string') valB = valB.toLowerCase();
                            if (valA < valB) return params.sortDir === 'asc' ? -1 : 1;
                            if (valA > valB) return params.sortDir === 'asc' ? 1 : -1;
                            return 0;
                        });
                    }

                    // Client-side pagination
                    const total = rows.length;
                    if (params.limit) {
                        const start = (params.page - 1) * params.limit;
                        const end = start + params.limit;
                        rows = rows.slice(start, end);
                    }

                    return { rows, total };
                }
            });

            await grid.init();
        });
    </script>
</body>
</html>
