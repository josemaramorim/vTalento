<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Gestão de Corretores</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .actions-btn {
            display: flex;
            gap: 10px;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
        }
        /* Estilos de Grid e Paginação migrados para PremiumGrid no style.css */
        .badge-admin { background: rgba(212, 175, 55, 0.1); color: var(--accent-primary); border: 1px solid rgba(212, 175, 55, 0.2); }
        .badge-corretor { background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.2); }
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo" style="font-size: 1.5rem; margin-bottom: 50px;">V-<span>TALENTOS</span></div>
            <nav id="navLinks" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- sidebar preenchido dinamicamente no script -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Formulário de Usuário -->
            <section class="form-card glass">
                <h2 id="formTitle" style="font-size: 1.2rem; margin-bottom: 20px; color: var(--accent-primary);">Novo Corretor</h2>
                <form id="usuarioForm">
                    <input type="hidden" id="usuarioId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nomeInput">Nome Completo</label>
                            <input type="text" id="nomeInput" placeholder="Ex: João da Silva" required>
                        </div>
                        <div class="form-group">
                            <label for="emailInput">E-mail (Acesso)</label>
                            <input type="email" id="emailInput" placeholder="Ex: joao@imobiliaria.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cpfInput">CPF (Opcional)</label>
                            <input type="text" id="cpfInput" placeholder="Ex: 000.000.000-00">
                        </div>
                        <div class="form-group" id="senhaGroup">
                            <label for="senhaInput" id="senhaLabel">Senha Temporária</label>
                            <input type="password" id="senhaInput" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <div class="form-group" id="redefinirSenhaGroup" style="display:none;">
                            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.85rem; color:var(--text-secondary); margin-bottom:8px;">
                                <input type="checkbox" id="redefinirSenhaCheck" onchange="toggleNovaSenha()" style="width:16px; height:16px; cursor:pointer;"> Redefinir senha do corretor
                            </label>
                            <input type="password" id="novaSenhaInput" placeholder="Nova senha (opcional)" style="display:none;">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="perfilSelect">Perfil de Acesso</label>
                            <select id="perfilSelect" style="width:100%; padding: 10px 14px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-primary); font-family: var(--font-main); font-size: 0.9rem; cursor: pointer;">
                                <option value="CORRETOR" selected>CORRETOR (Colaborador da Equipe)</option>
                                <option value="ADMIN_EMPRESA">ADMIN_EMPRESA (Administrador de Imobiliária)</option>
                            </select>
                        </div>
                    </div>

                    <div style="text-align: right; display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                        <button type="button" class="btn" id="btnCancelEdit" style="display: none; background: var(--bg-card); color: var(--text-primary);" onclick="resetForm()">CANCELAR</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit">SALVAR CORRETOR</button>
                    </div>
                </form>
            </section>

            <!-- Listagem de Corretores com PremiumGrid -->
            <section class="glass" style="padding: 25px; margin-top: 30px; margin-bottom: 25px;">
                <div id="gridUsuarios"></div>
            </section>
        </main>
    </div>



    <!-- MODAL DE CONFIRMAÇÃO DE EXCLUSÃO PREMIUM -->
    <div id="excluirModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1001; align-items:center; justify-content:center; padding: 20px; backdrop-filter: blur(10px);">
        <div class="glass" style="max-width:450px; width:100%; border-radius:16px; padding:32px; border:1px solid rgba(255,255,255,0.08); text-align:center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
            <div style="font-size: 3rem; color: var(--error); margin-bottom: 16px;">⚠️</div>
            <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin-bottom: 12px;">Confirmar Exclusão</h3>
            <p style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px;">
                Atenção: A exclusão de <strong id="excluirNome" style="color:var(--text-primary);"></strong> é permanente e <span style="color: var(--error); font-weight: 600;">todos os seus dados e histórico de transações associados serão apagados definitivamente</span> do sistema. Deseja continuar?
            </p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button onclick="closeExcluirModal()" class="btn" style="background: rgba(255,255,255,0.08); color: var(--text-primary); padding: 10px 24px; border-radius: 8px;">Cancelar</button>
                <button id="btnConfirmarExclusao" class="btn" style="background: var(--error); color: #fff; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;" onmouseover="this.style.filter='brightness(1.15)'" onmouseout="this.style.filter='brightness(1)'">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/premium-grid.js"></script>
    <script>
        // Check Admin Auth
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const currentUser = JSON.parse(userStr);
        const isAdmin = currentUser.perfil === 'ADMIN_EMPRESA' || currentUser.perfil === 'SUPER_ADMIN';

        if (!isAdmin) {
            window.location.href = 'dashboard.html';
        }

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }



        const API_BASE = 'http://localhost:3001/api/admin';
        let stateUsuarios = [];
        let globalGrid = null;

        async function setupGrid() {
            globalGrid = new PremiumGrid({
                containerId: 'gridUsuarios',
                title: 'Lista de Corretores da Equipe',
                totalCountId: 'usuariosTotalCount',
                columns: [
                    { key: 'nome', label: 'Nome', bold: true, sortable: true },
                    { key: 'email', label: 'E-mail', sortable: true },
                    { key: 'cpf', label: 'CPF', align: 'center' },
                    { key: 'perfil', label: 'Perfil', align: 'center', sortable: true },
                    { key: 'saldo_disponivel', label: 'Saldo Disponível', align: 'right', highlight: true, sortable: true },
                    { key: 'saldo_a_receber', label: 'Saldo a Receber', align: 'right', sortable: true },
                    { key: 'status', label: 'Status', align: 'center' },
                    { key: 'acoes', label: 'Ações', align: 'center' }
                ],
                filters: [
                    { id: 'busca', label: 'Pesquisar', type: 'text' },
                    { id: 'perfil', label: 'Perfil', type: 'select', options: [
                        { value: 'CORRETOR', label: 'Corretor' },
                        { value: 'ADMIN_EMPRESA', label: 'Admin' }
                    ]},
                    { id: 'ativo', label: 'Status', type: 'select', options: [
                        { value: 'true', label: 'Ativo' },
                        { value: 'false', label: 'Inativo' }
                    ]}
                ],
                pagination: { enabled: true, defaultPageSize: 10, pageSizeOptions: [10, 50, 100] },
                cellRenderer: (row, col) => {
                    if (col.key === 'cpf') return row.cpf || '—';
                    if (col.key === 'perfil') {
                        const badgeClass = row.perfil === 'ADMIN_EMPRESA' ? 'badge-admin' : 'badge-corretor';
                        const roleLabel = row.perfil === 'ADMIN_EMPRESA' ? 'Admin' : 'Corretor';
                        return `<span class="badge ${badgeClass}">${roleLabel}</span>`;
                    }
                    if (col.key === 'saldo_disponivel') return `<strong style="color: var(--accent-primary)">${parseFloat(row.saldo_disponivel).toFixed(2)} T$</strong>`;
                    if (col.key === 'saldo_a_receber') return `<span style="color: var(--text-secondary);">${parseFloat(row.saldo_a_receber).toFixed(2)} T$</span>`;
                    if (col.key === 'status') {
                        const isAtivo = String(row.ativo) === 'true' || row.ativo === 1 || row.ativo === true;
                        const statusText = isAtivo ? 'Ativo' : 'Inativo';
                        const statusColor = isAtivo ? 'var(--success)' : 'var(--error)';
                        return `<span class="badge" style="background: rgba(255,255,255,0.05); color: ${statusColor}; font-size: 0.72rem; padding: 4px 8px; border-radius: 4px; font-weight: 600;">${statusText}</span>`;
                    }
                    if (col.key === 'acoes') {
                        const isAtivo = String(row.ativo) === 'true' || row.ativo === 1 || row.ativo === true;
                        const toggleLabel = isAtivo ? 'Inativar' : 'Ativar';
                        const toggleStyle = isAtivo 
                            ? 'background: rgba(235, 77, 75, 0.15); color: var(--error); border: 1px solid rgba(235, 77, 75, 0.3);' 
                            : 'background: rgba(46, 213, 115, 0.15); color: var(--success); border: 1px solid rgba(46, 213, 115, 0.3);';

                        return `
                            <div class="actions-btn" style="justify-content: center; gap: 6px; display: flex;">
                                <button type="button" class="btn btn-sm" onclick="editUsuario('${row.id}')" style="background: rgba(255,255,255,0.1); color: var(--text-primary); padding: 4px 8px; font-size: 0.75rem;">Editar</button>
                                <button type="button" class="btn btn-sm" onclick="toggleStatus('${row.id}', ${isAtivo})" style="${toggleStyle} padding: 4px 8px; font-size: 0.75rem;">${toggleLabel}</button>
                                <button type="button" class="btn btn-sm" onclick="window.location.href='admin-movimentacoes.html?usuario_id=${row.id}'" style="background: rgba(212,175,55,0.15); color: var(--accent-primary); border: 1px solid rgba(212,175,55,0.3); padding: 4px 8px; font-size: 0.75rem;">Extrato</button>
                                <button type="button" class="btn btn-sm" onclick="confirmExcluir('${row.id}', '${row.nome}')" style="background: rgba(235, 77, 75, 0.2); color: var(--error); border: 1px solid rgba(235, 77, 75, 0.4); padding: 4px 8px; font-size: 0.75rem;">Excluir</button>
                            </div>
                        `;
                    }
                    return row[col.key];
                },
                fetchFn: async (params) => {
                    const queryParams = new URLSearchParams({
                        page: params.page,
                        limit: params.limit,
                        ...(params.filters.busca && { busca: params.filters.busca }),
                        ...(params.filters.perfil && { perfil: params.filters.perfil }),
                        ...(params.filters.ativo && { ativo: params.filters.ativo })
                    });
                    
                    if (params.sortBy) {
                        queryParams.append('sort_by', params.sortBy);
                        queryParams.append('sort_dir', params.sortDir);
                    }

                    const response = await fetch(`${API_BASE}/usuarios?${queryParams}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.status === 401) { logout(); return; }

                    const resData = await response.json();
                    if (!resData.success) throw new Error(resData.error || 'Erro ao carregar corretores');

                    // Armazenar para edição local
                    stateUsuarios = resData.data;

                    return {
                        rows: resData.data,
                        total: resData.meta.total
                    };
                }
            });

            await globalGrid.init();
        }

        // Wrapper function to keep compatibility with form actions calling fetchUsuarios
        function fetchUsuarios(pagina = 1) {
            if(globalGrid) {
                globalGrid.state.page = pagina;
                globalGrid.refresh();
            }
        }

        document.getElementById('usuarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('usuarioId').value;
            const nome = document.getElementById('nomeInput').value;
            const email = document.getElementById('emailInput').value;
            const cpf = document.getElementById('cpfInput').value;
            const senha = document.getElementById('senhaInput').value;
            const perfil = document.getElementById('perfilSelect').value;

            // Nova senha opcional ao editar
            const redefinirCheck = document.getElementById('redefinirSenhaCheck').checked;
            const novaSenha = redefinirCheck ? document.getElementById('novaSenhaInput').value : null;

            if (redefinirCheck && novaSenha && novaSenha.length < 6) {
                showToast('A nova senha deve ter ao menos 6 caracteres.', 'error');
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerText = 'PROCESSANDO...';

                const url = id ? `${API_BASE}/usuarios/${id}` : `${API_BASE}/usuarios`;
                const method = id ? 'PUT' : 'POST';

                const payload = { nome, email, cpf, perfil, ...(senha && !id ? { senha } : {}), ...(novaSenha ? { senha: novaSenha } : {}) };

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Erro ao salvar corretor');
                }

                showToast(id ? 'Dados do corretor atualizados!' : 'Novo corretor cadastrado com sucesso!', 'success');
                resetForm();
                await fetchUsuarios(1);

            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = id ? 'ATUALIZAR CORRETOR' : 'SALVAR CORRETOR';
            }
        });

        function editUsuario(id) {
            const usuario = stateUsuarios.find(u => u.id === id);
            if (!usuario) return;

            document.getElementById('formTitle').innerText = '✏️ Editando: ' + usuario.nome;
            document.getElementById('usuarioId').value = usuario.id;
            document.getElementById('nomeInput').value = usuario.nome;
            document.getElementById('emailInput').value = usuario.email;
            document.getElementById('cpfInput').value = usuario.cpf || '';
            document.getElementById('perfilSelect').value = usuario.perfil || 'CORRETOR';
            
            // No modo edição: oculta campo de senha obrigatória e mostra redefinir
            document.getElementById('senhaGroup').style.display = 'none';
            document.getElementById('senhaInput').required = false;
            document.getElementById('redefinirSenhaGroup').style.display = 'block';
            document.getElementById('redefinirSenhaCheck').checked = false;
            document.getElementById('novaSenhaInput').style.display = 'none';
            document.getElementById('novaSenhaInput').value = '';

            document.getElementById('btnSubmit').innerText = 'ATUALIZAR CORRETOR';
            document.getElementById('btnCancelEdit').style.display = 'inline-block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleNovaSenha() {
            const checked = document.getElementById('redefinirSenhaCheck').checked;
            document.getElementById('novaSenhaInput').style.display = checked ? 'block' : 'none';
            if (!checked) document.getElementById('novaSenhaInput').value = '';
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = 'Novo Corretor';
            document.getElementById('usuarioId').value = '';
            document.getElementById('usuarioForm').reset();
            document.getElementById('perfilSelect').value = 'CORRETOR';

            // Restaura campo de senha obrigatória
            document.getElementById('senhaGroup').style.display = 'block';
            document.getElementById('senhaInput').required = true;
            document.getElementById('redefinirSenhaGroup').style.display = 'none';
            document.getElementById('redefinirSenhaCheck').checked = false;
            document.getElementById('novaSenhaInput').style.display = 'none';
            document.getElementById('novaSenhaInput').value = '';

            document.getElementById('btnSubmit').innerText = 'SALVAR CORRETOR';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderHeader("Gestão de Corretores", "Cadastre, visualize e edite os corretores vinculados à sua imobiliária");
            setupGrid();
        });


        let excluirUsuarioId = null;

        function confirmExcluir(id, nome) {
            excluirUsuarioId = id;
            document.getElementById('excluirNome').innerText = nome;
            const modal = document.getElementById('excluirModal');
            modal.style.display = 'flex';
            
            // Define o clique do botão de confirmação
            document.getElementById('btnConfirmarExclusao').onclick = async () => {
                const btn = document.getElementById('btnConfirmarExclusao');
                btn.disabled = true;
                btn.innerText = 'Excluindo...';
                try {
                    const res = await fetch(`${API_BASE}/usuarios/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (!data.success) throw new Error(data.error);

                    showToast('Corretor excluído com sucesso!', 'success');
                    closeExcluirModal();
                    fetchUsuarios(globalGrid ? globalGrid.state.page : 1);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Sim, Excluir';
                }
            };
        }

        function closeExcluirModal() {
            document.getElementById('excluirModal').style.display = 'none';
            excluirUsuarioId = null;
        }

        async function toggleStatus(id, currentAtivo) {
            try {
                const isAtivo = String(currentAtivo) === 'true' || currentAtivo === 1 || currentAtivo === true;
                const novoStatus = !isAtivo;

                const res = await fetch(`${API_BASE}/usuarios/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ativo: novoStatus })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);

                showToast(`Status do corretor atualizado para ${novoStatus ? 'Ativo' : 'Inativo'}`, 'success');
                fetchUsuarios(globalGrid ? globalGrid.state.page : 1);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        document.getElementById('excluirModal')?.addEventListener('click', function(e) {
            if (e.target === this) closeExcluirModal();
        });
    </script>
</body>
</html>
