<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Lançamento Manual</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
        }

        .main-content {
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .form-card {
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        /* History Table Style */
        .history-card {
            padding: 30px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-credito {
            background: rgba(46, 204, 113, 0.2);
            color: var(--success);
        }

        .badge-debito {
            background: rgba(231, 76, 60, 0.2);
            color: var(--error);
        }

        .badge-estorno {
            background: rgba(230, 126, 34, 0.2);
            color: var(--warning);
        }

        .theme-toggle {
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo" style="font-size: 1.5rem; margin-bottom: 50px;">V-<span>TALENTOS</span></div>
            <nav style="display: flex; flex-direction: column; gap: 15px;">
                <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px;">PAINEL ADMIN</p>
                <a href="dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">🏠 Dashboard</a>
                <a href="admin-lancamento.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">💎 Lançamento Manual</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1 style="font-size: 1.8rem; margin-bottom: 5px;">Ajustes de Saldo</h1>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Lançamentos manuais com auditoria total</p>
                </div>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <button class="theme-toggle" id="themeToggle" title="Alternar Tema">🌓</button>
                    <button class="btn" onclick="logout()" style="padding: 8px 16px; font-size: 0.8rem; background: rgba(255,0,0,0.1); color: var(--error);">SAIR</button>
                </div>
            </header>

            <!-- Formulário de lançamento -->
            <section class="form-card glass">
                <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--accent-primary);">Novo Ajuste Manual</h2>
                <form id="lancamentoForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="corretorSelect">Corretor</label>
                            <select id="corretorSelect" required>
                                <option value="" disabled selected>Selecione um Corretor...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tipoSelect">Tipo de Operação</label>
                            <select id="tipoSelect" required>
                                <option value="CREDITO">Crédito (+) de Talentos</option>
                                <option value="DEBITO">Débito (-) de Talentos</option>
                                <option value="ESTORNO">Estorno (Ajuste)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="valorInput">Valor (Talentos)</label>
                            <input type="number" id="valorInput" min="1" step="any" placeholder="Ex: 500" required>
                        </div>
                        <div class="form-group">
                            <label for="justificativaInput">Justificativa</label>
                            <textarea id="justificativaInput" rows="2" placeholder="Meta batida, prêmio extra, correção de planilha..." required></textarea>
                        </div>
                    </div>

                    <div style="text-align: right;">
                        <button type="submit" class="btn btn-primary" id="btnSubmit">EFETUAR LANÇAMENTO</button>
                    </div>
                </form>
            </section>

            <!-- Histórico Recente -->
            <section class="history-card glass">
                <h2 style="font-size: 1.2rem; margin-bottom: 10px; color: var(--text-primary);">Histórico Recente de Lançamentos</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Corretor</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                                <th>Autor por</th>
                                <th>Justificativa</th>
                            </tr>
                        </thead>
                        <tbody id="historicoTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-secondary);">Nenhum lançamento registrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        // Check Admin Auth
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(userStr);
            if (user.perfil !== 'ADMIN_EMPRESA' && user.perfil !== 'SUPER_ADMIN') {
                alert('Acesso restrito a administradores.');
                window.location.href = 'dashboard.html';
            }
        }

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }

        // Toggle Theme
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.setAttribute('data-theme', savedTheme);
        }

        // API Integration
        const API_BASE = 'http://localhost:3001/api/admin';

        async function fetchCorretores() {
            try {
                const response = await fetch(`${API_BASE}/corretores`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const select = document.getElementById('corretorSelect');
                data.forEach(corretor => {
                    const option = document.createElement('option');
                    option.value = corretor.id;
                    option.textContent = `${corretor.nome} (${corretor.email}) - Saldo: ${corretor.saldo_disponivel}`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Erro ao buscar corretores:', err);
            }
        }

        async function fetchHistorico() {
            try {
                const response = await fetch(`${API_BASE}/historico-recente`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const tbody = document.getElementById('historicoTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">Nenhum lançamento registrado.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    const dataFormatada = new Date(item.created_at).toLocaleString('pt-BR');
                    
                    const badgeClass = item.tipo.toLowerCase();
                    const sinal = item.tipo === 'CREDITO' ? '+' : '';
                    
                    tr.innerHTML = `
                        <td>${dataFormatada}</td>
                        <td><strong>${item.corretor_nome}</strong></td>
                        <td><span class="badge badge-${badgeClass}">${item.tipo}</span></td>
                        <td><strong>${sinal}${parseFloat(item.valor).toFixed(2)}</strong></td>
                        <td>${item.admin_nome}</td>
                        <td style="color: var(--text-secondary); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.justificativa}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Erro ao buscar histórico:', err);
            }
        }

        // Form Submit
        document.getElementById('lancamentoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario_id = document.getElementById('corretorSelect').value;
            const tipo = document.getElementById('tipoSelect').value;
            const valor = document.getElementById('valorInput').value;
            const justificativa = document.getElementById('justificativaInput').value;
            const btnSubmit = document.getElementById('btnSubmit');

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerText = 'PROCESSANDO...';

                const response = await fetch(`${API_BASE}/lancamento-manual`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ usuario_id, tipo, valor, justificativa })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao realizar lançamento');
                }

                alert('Lançamento efetuado com sucesso!');
                
                // Reset form
                document.getElementById('lancamentoForm').reset();
                
                // Refresh data
                await fetchHistorico();
                
                // Clean and reload corretor options to update balances
                const select = document.getElementById('corretorSelect');
                select.innerHTML = '<option value="" disabled selected>Selecione um Corretor...</option>';
                await fetchCorretores();

            } catch (err) {
                alert(err.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'EFETUAR LANÇAMENTO';
            }
        });

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            fetchCorretores();
            fetchHistorico();
        });
    </script>
</body>
</html>
