<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-TALENTOS | Lançamento Manual</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo" style="font-size: 1.5rem; margin-bottom: 50px;">V-<span>TALENTOS</span></div>
            <nav id="navLinks" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Preenchido dinamicamente no script -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Formulário de lançamento -->
            <section class="form-card glass">
                <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--accent-primary);">Novo Ajuste Manual</h2>
                <form id="lancamentoForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="corretorSelect">Corretor</label>
                            <select id="corretorSelect" required>
                                <option value="" disabled selected>Selecione um Corretor...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tipoSelect">Tipo de Operação</label>
                            <select id="tipoSelect" required>
                                <option value="CREDITO">Crédito (+) de Talentos</option>
                                <option value="DEBITO">Débito (-) de Talentos</option>
                                <option value="ESTORNO">Estorno (Ajuste)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="valorInput">Valor (Talentos)</label>
                            <input type="number" id="valorInput" min="1" step="any" placeholder="Ex: 500" required>
                        </div>
                        <div class="form-group">
                            <label for="justificativaInput">Justificativa</label>
                            <textarea id="justificativaInput" rows="2" placeholder="Meta batida, prêmio extra, correção de planilha..." required></textarea>
                        </div>
                    </div>

                    <div style="text-align: right;">
                        <button type="submit" class="btn btn-primary" id="btnSubmit">EFETUAR LANÇAMENTO</button>
                    </div>
                </form>
            </section>

            <!-- Histórico Recente -->
            <section class="history-card glass">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h2 style="font-size: 1.2rem; color: var(--text-primary);">📋 Histórico Recente de Lançamentos Manuais</h2>
                    <span style="font-size:0.78rem; color:var(--text-secondary); font-style:italic;">Últimos 20 ajustes manuais desta empresa</span>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Data / Hora</th>
                                <th>Corretor</th>
                                <th>Tipo</th>
                                <th>Valor (T$)</th>
                                <th>Status</th>
                                <th>Realizado por</th>
                                <th>Justificativa</th>
                            </tr>
                        </thead>
                        <tbody id="historicoTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center; color: var(--text-secondary);">Nenhum lançamento registrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        // Check Admin Auth
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(userStr);
            if (user.perfil !== 'ADMIN_EMPRESA' && user.perfil !== 'SUPER_ADMIN') {
                showToast('Acesso restrito a administradores.', 'error');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            }
        }

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }

        // Toggle Theme is managed dynamically and globally by assets/js/auth.js

        // API Integration
        const API_BASE = 'http://localhost:3001/api/admin';

        async function fetchCorretores() {
            try {
                const response = await fetch(`${API_BASE}/corretores`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const select = document.getElementById('corretorSelect');
                data.forEach(corretor => {
                    const option = document.createElement('option');
                    option.value = corretor.id;
                    option.textContent = `${corretor.nome} (${corretor.email}) - Saldo: ${corretor.saldo_disponivel}`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Erro ao buscar corretores:', err);
            }
        }

        async function fetchHistorico() {
            try {
                const response = await fetch(`${API_BASE}/historico-recente`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const tbody = document.getElementById('historicoTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 20px 0;">Nenhum ajuste manual registrado ainda. Use o formulário acima para criar o primeiro lançamento.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    const dataFormatada = new Date(item.created_at).toLocaleString('pt-BR');
                    
                    const badgeClass = item.tipo.toLowerCase();
                    const valorAbs = Math.abs(parseFloat(item.valor));
                    const isCred = item.tipo === 'CREDITO';
                    const isEstorno = item.tipo === 'ESTORNO';
                    const corValor = isCred ? 'var(--success)' : isEstorno ? 'var(--warning)' : 'var(--error)';
                    const sinal = isCred ? '+' : isEstorno ? '±' : '-';

                    const statusBadge = item.status
                        ? `<span class="badge badge-${item.status.toLowerCase()}" style="font-size:0.7rem;">${item.status}</span>`
                        : `<span style="color:var(--text-secondary); font-size:0.75rem;">—</span>`;
                    
                    tr.innerHTML = `
                        <td style="font-size:0.82rem; white-space:nowrap;">${dataFormatada}</td>
                        <td><strong>${item.corretor_nome}</strong></td>
                        <td><span class="badge badge-${badgeClass}">${item.tipo}</span></td>
                        <td><strong style="color:${corValor}; font-size:1rem;">${sinal}${valorAbs.toFixed(2)} T$</strong></td>
                        <td>${statusBadge}</td>
                        <td style="font-size:0.82rem; color:var(--text-secondary);">${item.admin_nome}</td>
                        <td style="color: var(--text-secondary); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size:0.82rem;" title="${item.justificativa}">${item.justificativa}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Erro ao buscar histórico:', err);
            }
        }

        // Form Submit
        document.getElementById('lancamentoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario_id = document.getElementById('corretorSelect').value;
            const tipo = document.getElementById('tipoSelect').value;
            const valorRaw = document.getElementById('valorInput').value;
            const valor = parseFloat(valorRaw);
            const justificativa = document.getElementById('justificativaInput').value;
            const btnSubmit = document.getElementById('btnSubmit');

            if (isNaN(valor) || valor <= 0) {
                showToast('O valor do lançamento deve ser maior que zero.', 'error');
                return;
            }

            const selectEl = document.getElementById('corretorSelect');
            const corretorNome = selectEl.options[selectEl.selectedIndex].text;

            const tipoFormatado = tipo === 'CREDITO' ? 'CRÉDITO (+)' : tipo === 'DEBITO' ? 'DÉBITO (-)' : 'ESTORNO';
            const mensagem = `Deseja realmente realizar um ajuste de <strong>${tipoFormatado}</strong> de <strong>${valor.toFixed(2)} T$</strong> para o corretor <strong>${corretorNome}</strong>?<br><br><span style="color: var(--error); font-weight: 700;">⚠️ Atenção: Esta operação será auditada e gravada permanentemente. Não é possível excluir lançamentos de saldo.</span>`;

            showConfirmModal('Ajustes de Saldo', mensagem, async () => {
                try {
                    btnSubmit.disabled = true;
                    btnSubmit.innerText = 'PROCESSANDO...';

                    const response = await fetch(`${API_BASE}/lancamento-manual`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ usuario_id, tipo, valor, justificativa })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Erro ao realizar lançamento');
                    }

                    showToast('Lançamento efetuado com sucesso!', 'success');
                    
                    // Reset form
                    document.getElementById('lancamentoForm').reset();
                    
                    // Refresh data
                    await fetchHistorico();
                    
                    // Clean and reload corretor options to update balances
                    const select = document.getElementById('corretorSelect');
                    select.innerHTML = '<option value="" disabled selected>Selecione um Corretor...</option>';
                    await fetchCorretores();

                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = 'EFETUAR LANÇAMENTO';
                }
            });
        });


        // Init
        window.addEventListener('DOMContentLoaded', () => {
            renderHeader("Ajustes de Saldo", "Lançamentos manuais com auditoria total");
            fetchCorretores();
            fetchHistorico();
        });
    </script>
</body>
</html>
