<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard - V-Talentos SaaS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card-premium {
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .stat-card-premium::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .stat-card-premium .icon-box {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-card-premium .val {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: var(--font-heading);
            margin-bottom: 4px;
        }
        .stat-card-premium .lbl {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .grid-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 992px) {
            .grid-charts {
                grid-template-columns: 1fr;
            }
        }
        .chart-container {
            padding: 30px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chart-bar-grid {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 200px;
            padding-top: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .chart-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .chart-bar {
            width: 35px;
            background: linear-gradient(180deg, var(--accent-primary) 0%, rgba(212, 175, 55, 0.2) 100%);
            border-radius: 6px 6px 0 0;
            transition: all 0.5s ease;
            position: relative;
            cursor: pointer;
        }
        .chart-bar:hover {
            background: linear-gradient(180deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
            transform: scaleY(1.05);
        }
        .chart-bar::before {
            content: attr(data-value);
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .chart-bar:hover::before {
            opacity: 1;
        }
        .chart-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
        }
        .toggle-switch {
            display: flex !important;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .toggle-switch input {
            display: none;
        }
        .switch-slider {
            display: inline-block;
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            position: relative;
            transition: background 0.3s ease;
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .switch-slider::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        input:checked + .switch-slider {
            background: var(--success);
        }
        input:checked + .switch-slider::before {
            transform: translateX(24px);
        }
        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .recent-item {
            padding: 15px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .recent-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(212, 175, 55, 0.2);
        }

        /* Modal Overlay Premium (Correção 2) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-close-btn:hover {
            color: var(--error) !important;
        }

        /* Badges de Provedores */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-stripe { background: rgba(103, 114, 229, 0.1); color: #6772e5; border: 1px solid rgba(103, 114, 229, 0.2); }
        .badge-asaas { background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.2); }
        .badge-ativo { background: rgba(46, 204, 113, 0.1); color: var(--success); border: 1px solid rgba(46, 204, 113, 0.2); }
        .badge-inativo { background: rgba(231, 76, 60, 0.1); color: var(--error); border: 1px solid rgba(231, 76, 60, 0.2); }

        .premium-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .premium-table th {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--glass-border);
        }
        .premium-table td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.88rem;
            color: var(--text-primary);
        }
        .premium-table tr:last-child td {
            border-bottom: none;
        }
        .premium-table tr:hover {
            background: rgba(255, 255, 255, 0.01);
        }
    </style>
</head>
<body data-theme="dark">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">V-<span>TALENTOS</span></div>
            <nav id="navLinks">
                <!-- Injetado dinamicamente -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header" id="appHeader"></header>

            <!-- Dashboard KPIs -->
            <div class="dashboard-grid animate-fade">
                <div class="stat-card-premium glass" style="border-left: 4px solid var(--success);">
                    <div class="icon-box" style="color: var(--success);">💰</div>
                    <div>
                        <div class="val" id="kpiTotalFaturado">R$ 0,00</div>
                        <div class="lbl">Faturamento Acumulado</div>
                    </div>
                </div>

                <div class="stat-card-premium glass" style="border-left: 4px solid var(--accent-primary);">
                    <div class="icon-box" style="color: var(--accent-primary);">🏢</div>
                    <div>
                        <div class="val" id="kpiEmpresasAtivas">0</div>
                        <div class="lbl">Parceiros Ativos</div>
                    </div>
                </div>

                <div class="stat-card-premium glass" style="border-left: 4px solid var(--error);">
                    <div class="icon-box" style="color: var(--error);">⚠️</div>
                    <div>
                        <div class="val" id="kpiInadimplencia">0</div>
                        <div class="lbl">Inquilinos Suspensos</div>
                    </div>
                </div>

                <div class="stat-card-premium glass" style="border-left: 4px solid var(--warning);">
                    <div class="icon-box" style="color: var(--warning);">⚡</div>
                    <div>
                        <div class="val" id="kpiDiasCortesia">7 Dias</div>
                        <div class="lbl">Cortesia Padrão</div>
                    </div>
                </div>
            </div>

            <!-- Gráficos e Ajustes Globais -->
            <div class="grid-charts animate-fade" style="animation-delay: 0.1s;">
                <!-- Gráfico de Crescimento -->
                <div class="chart-container glass">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="font-size: 1.2rem; font-weight: 600;">📈 Saúde da Plataforma (Faturamento Mensal)</h2>
                        <span style="font-size: 0.75rem; color: var(--text-secondary); background: rgba(255,255,255,0.06); padding: 4px 12px; border-radius: 12px;">Simulação Ativa</span>
                    </div>

                    <div class="chart-bar-grid">
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="height: 45px;" data-value="R$ 1.194"></div>
                            <span class="chart-label">Jan</span>
                        </div>
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="height: 60px;" data-value="R$ 1.592"></div>
                            <span class="chart-label">Fev</span>
                        </div>
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="height: 85px;" data-value="R$ 2.188"></div>
                            <span class="chart-label">Mar</span>
                        </div>
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="height: 120px;" data-value="R$ 3.184"></div>
                            <span class="chart-label">Abr</span>
                        </div>
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="height: 160px;" data-value="R$ 4.380"></div>
                            <span class="chart-label">Mai</span>
                        </div>
                    </div>
                </div>

                <!-- Configurações Globais -->
                <div class="glass" style="padding: 30px; display: flex; flex-direction: column; justify-content: space-between;">
                    <h2 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 20px;">⚙️ Configurações Globais SaaS</h2>
                    
                    <form id="configForm">
                        <div class="form-group">
                            <label for="diasCortesia">Dias Padrão de Cortesia (Acesso Emergencial)</label>
                            <input type="number" id="diasCortesia" class="form-control" min="1" max="60" required>
                        </div>

                        <div class="form-group">
                            <label class="toggle-switch">
                                <input type="checkbox" id="simularPagos">
                                <span class="switch-slider"></span>
                                <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);">Simular Pagamentos (Sandbox)</span>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600;">SALVAR PARÂMETROS</button>
                    </form>
                </div>
            </div>


        </main>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        const token = localStorage.getItem('@VTalentos:token');
        const userStr = localStorage.getItem('@VTalentos:user');

        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userStr);
        if (user.perfil !== 'SUPER_ADMIN') {
            window.location.href = 'dashboard.html';
        }

        // Renderiza o cabeçalho dinâmico do Super-Admin
        renderHeader('Olá, Super Admin!', 'Gestão centralizada do SaaS, faturamento e configurações globais');

        // Renderiza Sidebar
        const nav = document.getElementById('navLinks');
        nav.innerHTML = `
            <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px;">SAAS PLATAFORMA</p>
            <a href="super-dashboard.html" class="active" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">📊 Plataforma Dashboard</a>
            <a href="super-empresas.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">🏢 Inquilinos (Empresas)</a>
            <a href="super-usuarios.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👥 Usuários Isolados</a>
            <a href="super-faturamento.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">💰 Faturamento SaaS</a>
            <a href="super-provedores.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">💳 Provedores de Pgto.</a>
            <p style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 1px; margin-top: 20px; margin-bottom: 10px;">PERFIL</p>
            <a href="meu-perfil.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">👤 Meus Dados</a>
        `;

        // Provedores de pagamento movidos para a página dedicada super-provedores.html
        async function loadPlataformaData() {
            try {
                // 1. Carrega Configurações Globais
                const configRes = await fetch('http://localhost:3001/api/super/configs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const configData = await configRes.json();
                
                if (configData.success) {
                    const c = configData.configs;
                    document.getElementById('diasCortesia').value = c.dias_padrao_cortesia || 7;
                    document.getElementById('simularPagos').checked = c.simular_pagamentos === 'true';
                    document.getElementById('kpiDiasCortesia').innerText = `${c.dias_padrao_cortesia || 7} Dias`;
                }

                // 2. Carrega KPIs agregados das Empresas
                const empRes = await fetch('http://localhost:3001/api/super/empresas?limit=100', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const empData = await empRes.json();
                
                if (empData.success) {
                    let totalFaturado = 0;
                    let empresasAtivas = 0;
                    let inquilinosSuspensos = 0;

                    empData.data.forEach(emp => {
                        totalFaturado += emp.total_pago || 0;
                        if (emp.status === 'ATIVO') {
                            empresasAtivas++;
                        } else if (emp.status === 'SUSPENSO') {
                            inquilinosSuspensos++;
                        }
                    });

                    document.getElementById('kpiTotalFaturado').innerText = `R$ ${totalFaturado.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
                    document.getElementById('kpiEmpresasAtivas').innerText = empresasAtivas;
                    document.getElementById('kpiInadimplencia').innerText = inquilinosSuspensos;
                }
            } catch (err) {
                console.error(err);
                showToast('Erro ao carregar dados consolidados da plataforma.', 'error');
            }
        }

        // Salvar Configurações Gerais
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dias_padrao_cortesia = document.getElementById('diasCortesia').value;
            const simular_pagamentos = document.getElementById('simularPagos').checked ? 'true' : 'false';

            try {
                const res = await fetch('http://localhost:3001/api/super/configs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ dias_padrao_cortesia, simular_pagamentos })
                });

                const data = await res.json();
                if (data.success) {
                    showToast('Parâmetros de configuração salvos com sucesso!', 'success');
                    loadPlataformaData();
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showToast(err.message || 'Falha ao salvar as configurações.', 'error');
            }
        });

        function logout() {
            localStorage.removeItem('@VTalentos:token');
            localStorage.removeItem('@VTalentos:user');
            window.location.href = 'login.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadPlataformaData();
        });
    </script>
</body>
</html>
